<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101317"><title>Planner · To Do</title>
<style>
:root{color-scheme:dark;--bg:#101317;--panel:#20262c;--line:#343c43;--muted:#a4adb4;--lime:#b8ed69;--ink:#f5f7f8}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px Roboto,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.55;cursor:wait}.app{max-width:700px;margin:0 auto;padding:25px 17px 110px}header{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}h1{font-size:32px;margin:4px 0 0}h2{font-size:22px;margin:0 0 15px}h3{font-size:17px}.eyebrow{color:var(--lime);font-size:12px;font-weight:750;letter-spacing:.09em}.muted{color:var(--muted)}.small{font-size:13px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:17px;padding:17px;margin:12px 0}.topline{display:flex;align-items:center;justify-content:space-between;gap:8px}.btn{border:1px solid #50585f;border-radius:12px;background:#30383e;color:#fff;padding:11px 14px}.btn.primary{background:var(--lime);border-color:var(--lime);color:#121710;font-weight:800}.btn.ghost{background:none;border-color:transparent;color:var(--lime)}.btn.red{color:#ffabab}.wide{width:100%}.row{display:flex;gap:10px;align-items:center}.grow{flex:1}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat b{display:block;color:var(--lime);font-size:28px}.stat span{font-size:13px;color:var(--muted)}.filters{display:flex;gap:8px;overflow-x:auto;padding:6px 0 12px}.filters button{white-space:nowrap}.filters button.on{background:var(--lime);color:#121710}.task{display:flex;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:14px;margin:9px 0}.task button.open{border:0;background:none;color:inherit;text-align:left;flex:1;padding:3px}.task b{display:block}.task small{display:block;color:var(--muted);margin-top:5px}.task.done b{text-decoration:line-through;color:#99a4a8}.check{height:30px;width:30px;border:2px solid #88939b;border-radius:50%;background:transparent;color:var(--lime);font-size:19px}.check.yes{border-color:var(--lime)}.field{display:block;margin:12px 0 5px;color:#c8d1d3;font-size:14px}input,select,textarea{width:100%;background:#151b20;border:1px solid #56616a;color:#fff;border-radius:12px;padding:13px;outline-color:var(--lime)}textarea{min-height:95px;resize:vertical}.modal{position:fixed;inset:0;background:#000c;display:none;z-index:50;align-items:flex-end;justify-content:center}.modal.show{display:flex}.sheet{background:#191f23;border:1px solid #3c464a;border-radius:24px 24px 0 0;max-width:700px;width:100%;padding:20px 18px calc(24px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto}.note{border-left:2px solid var(--lime);padding:2px 0 7px 12px;margin:12px 0;white-space:pre-wrap;overflow-wrap:anywhere}.note time{display:block;color:var(--lime);font-size:12px;margin-bottom:5px}nav{position:fixed;bottom:0;left:0;right:0;background:#171d21eb;border-top:1px solid var(--line);padding:12px 10px calc(12px + env(safe-area-inset-bottom));backdrop-filter:blur(12px)}nav .inner{max-width:700px;margin:auto;display:flex;justify-content:space-around}nav a,nav button{color:#cdd5da;text-decoration:none;background:none;border:0;font-size:13px}nav .active{color:var(--lime)}.notice{padding:12px;background:#2b3029;border-radius:10px;color:#d6efba;margin:10px 0}.hidden{display:none!important}.empty{padding:30px 8px;color:var(--muted);text-align:center}
</style></head><body><main class="app">
<header><div><div class="eyebrow">PLANNER</div><h1>To Do</h1></div><button class="btn" id="authButton">Sign in</button></header>
<section id="authPanel" class="panel"><h2>Secure your tasks</h2><p class="muted small">Sign in with your email to save your tasks and notes across devices. Your existing habits are not affected.</p><label class="field" for="email">Email address</label><input id="email" type="email" placeholder="you@example.com" autocomplete="email"><button class="btn primary wide" id="sendLink" style="margin-top:12px">Email me a sign-in link</button><div id="authMessage" class="small muted" aria-live="polite"></div></section>
<section id="workspace" class="hidden">
<div class="stats"><div class="panel stat"><b id="openCount">0</b><span>Tasks remaining</span></div><div class="panel stat"><b id="doneCount">0</b><span>Completed</span></div></div>
<div class="topline"><h2>My tasks</h2><button class="btn primary" id="addTask">+ Add task</button></div>
<div class="filters" id="filters"><button class="btn on" data-filter="active">Active</button><button class="btn" data-filter="all">All</button><button class="btn" data-filter="completed">Completed</button></div>
<div id="tasks"></div>
<div class="topline" style="margin-top:24px"><h2>Projects</h2><button class="btn" id="addProject">+ Project</button></div><div id="projects"></div>
</section><div class="notice hidden" id="status" role="status"></div>
</main>
<nav><div class="inner"><a href="./index.html">Habits ↗</a><span class="active">To Do</span><button id="navProjects">Projects</button></div></nav>
<div class="modal" id="taskModal"><div class="sheet"><div class="topline"><h2 id="taskHeading">Task</h2><button class="btn" id="closeTask">Close</button></div>
<label class="field">Title</label><input id="taskTitle" maxlength="250" placeholder="What needs to be done?">
<label class="field">Details</label><textarea id="taskDescription" placeholder="Details or instructions"></textarea>
<label class="field">Project</label><select id="taskProject"><option value="">No project</option></select>
<div class="row"><div class="grow"><label class="field">Status</label><select id="taskStatus"><option value="open">To do</option><option value="in_progress">In progress</option><option value="waiting">Waiting</option><option value="completed">Completed</option><option value="cancelled">Cancelled</option></select></div>
<div class="grow"><label class="field">Priority</label><select id="taskPriority"><option value="normal">Normal</option><option value="high">High</option><option value="low">Low</option></select></div></div>
<label class="field">Due date (optional)</label><input type="date" id="taskDue">
<button class="btn primary wide" style="margin-top:16px" id="saveTask">Save task</button>
<section id="notesSection" class="hidden"><h3>Progress history</h3><p class="muted small">Each update is dated and stays in the record.</p><div id="notes"></div>
<label class="field">Add a progress update</label><textarea id="noteBody" placeholder="What happened? What is the next step?"></textarea><button class="btn primary wide" id="saveNote">Add update</button>
</section></div></div>
<div class="modal" id="projectModal"><div class="sheet"><div class="topline"><h2>New project</h2><button class="btn" id="closeProject">Close</button></div>
<label class="field">Project name</label><input id="projectTitle" placeholder="e.g. Resolve IRS balance" maxlength="250">
<label class="field">Description (optional)</label><textarea id="projectDescription"></textarea><button class="btn primary wide" id="saveProject">Create project</button></div></div>
<script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2.57.4';
const db=createClient('https://cuskrbjngfyffmgpdicu.supabase.co','sb_publishable_drg850O15PbD4RCYmgHCiA_s8fc2jNu');
const $=id=>document.getElementById(id);let user=null,tasks=[],projects=[],currentTask=null,filter='active';
const escapeHtml=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function notice(message){$('status').textContent=message;$('status').classList.remove('hidden');setTimeout(()=>$('status').classList.add('hidden'),5500)}
function err(e){console.error(e);notice(e?.message||'Something went wrong. Please try again.')}
function visible(id,yes){$(id).classList.toggle('hidden',!yes)}
async function sync(){if(!user)return;const [t,p]=await Promise.all([db.from('planner_tasks').select('*').eq('owner_id',user.id).order('created_at',{ascending:false}),db.from('planner_projects').select('*').eq('owner_id',user.id).order('created_at',{ascending:false})]);if(t.error||p.error)throw t.error||p.error;tasks=t.data||[];projects=p.data||[];render()}
function render(){const active=tasks.filter(t=>!['completed','cancelled'].includes(t.status));$('openCount').textContent=active.length;$('doneCount').textContent=tasks.filter(t=>t.status==='completed').length;const list=tasks.filter(t=>filter==='all'||(filter==='active'?!['completed','cancelled'].includes(t.status):t.status==='completed'));$('tasks').innerHTML=list.length?list.map(t=>'<article class="task '+(t.status==='completed'?'done':'')+'"><button class="check '+(t.status==='completed'?'yes':'')+'" data-toggle="'+t.id+'" aria-label="Toggle completion">'+(t.status==='completed'?'✓':'')+'</button><button class="open" data-open="'+t.id+'"><b>'+escapeHtml(t.title)+'</b><small>'+escapeHtml(t.status.replace('_',' '))+(t.due_at?' · Due '+escapeHtml(t.due_at.slice(0,10)):'')+(t.project_id?' · '+escapeHtml(projects.find(p=>p.id===t.project_id)?.title||'Project'):'')+'</small></button></article>').join(''):'<div class="empty">No tasks here yet.</div>';
$('projects').innerHTML=projects.length?projects.map(p=>'<div class="panel"><b>'+escapeHtml(p.title)+'</b><div class="small muted">'+tasks.filter(t=>t.project_id===p.id&&t.status!=='completed').length+' remaining tasks</div></div>').join(''):'<div class="empty">Create a project for longer-running work.</div>';
$('taskProject').innerHTML='<option value="">No project</option>'+projects.map(p=>'<option value="'+p.id+'">'+escapeHtml(p.title)+'</option>').join('')}
function showModal(id){$(id).classList.add('show')}function hideModal(id){$(id).classList.remove('show')}
function editTask(id=null){currentTask=tasks.find(t=>t.id===id)||null;const t=currentTask;$('taskHeading').textContent=t?'Edit task':'New task';$('taskTitle').value=t?.title||'';$('taskDescription').value=t?.description||'';$('taskProject').value=t?.project_id||'';$('taskStatus').value=t?.status||'open';$('taskPriority').value=t?.priority||'normal';$('taskDue').value=t?.due_at?.slice(0,10)||'';visible('notesSection',!!t);$('noteBody').value='';$('notes').innerHTML='';showModal('taskModal');if(t)loadNotes(t.id)}
async function loadNotes(taskId){const r=await db.from('planner_task_notes').select('*').eq('owner_id',user.id).eq('task_id',taskId).order('created_at',{ascending:false});if(r.error){err(r.error);return}$('notes').innerHTML=r.data.length?r.data.map(n=>'<div class="note"><time>'+new Date(n.created_at).toLocaleString()+'</time>'+escapeHtml(n.body)+'</div>').join(''):'<p class="muted small">No updates yet.</p>'}
async function saveTask(){const title=$('taskTitle').value.trim();if(!title){notice('Enter a task title.');return}const status=$('taskStatus').value,payload={title,description:$('taskDescription').value.trim(),project_id:$('taskProject').value||null,status,priority:$('taskPriority').value,due_at:$('taskDue').value?$('taskDue').value+'T12:00:00Z':null,completed_at:status==='completed'?(currentTask?.completed_at||new Date().toISOString()):null,updated_at:new Date().toISOString()};$('saveTask').disabled=true;try{const q=currentTask?db.from('planner_tasks').update(payload).eq('id',currentTask.id).eq('owner_id',user.id):db.from('planner_tasks').insert({...payload,owner_id:user.id});const r=await q.select().single();if(r.error)throw r.error;hideModal('taskModal');await sync();notice('Task saved.')}catch(e){err(e)}finally{$('saveTask').disabled=false}}
async function addNote(){if(!currentTask)return;const body=$('noteBody').value.trim();if(!body)return;$('saveNote').disabled=true;try{const r=await db.from('planner_task_notes').insert({owner_id:user.id,task_id:currentTask.id,body,source:'planner'});if(r.error)throw r.error;$('noteBody').value='';await loadNotes(currentTask.id);notice('Update recorded.')}catch(e){err(e)}finally{$('saveNote').disabled=false}}
async function addProject(){const title=$('projectTitle').value.trim();if(!title)return;try{const r=await db.from('planner_projects').insert({owner_id:user.id,title,description:$('projectDescription').value.trim()});if(r.error)throw r.error;hideModal('projectModal');$('projectTitle').value='';$('projectDescription').value='';await sync();notice('Project created.')}catch(e){err(e)}}
async function toggleTask(id){const t=tasks.find(x=>x.id===id);if(!t)return;const completed=t.status!=='completed';const r=await db.from('planner_tasks').update({status:completed?'completed':'open',completed_at:completed?new Date().toISOString():null,updated_at:new Date().toISOString()}).eq('id',id).eq('owner_id',user.id);if(r.error)err(r.error);else await sync()}
async function showSession(){const {data:{user:u}}=await db.auth.getUser();user=u;visible('authPanel',!u);visible('workspace',!!u);$('authButton').textContent=u?'Sign out':'Sign in';if(u)try{await sync()}catch(e){err(e)}}
$('sendLink').onclick=async()=>{const email=$('email').value.trim();if(!email){$('authMessage').textContent='Enter your email first.';return}$('sendLink').disabled=true;const r=await db.auth.signInWithOtp({email,options:{emailRedirectTo:location.origin+location.pathname}});$('sendLink').disabled=false;$('authMessage').textContent=r.error?r.error.message:'Check your email for a sign-in link.'};
$('authButton').onclick=async()=>{if(user){await db.auth.signOut();user=null;tasks=[];projects=[];showSession()}else $('email').focus()};
$('addTask').onclick=()=>editTask();$('closeTask').onclick=()=>hideModal('taskModal');$('saveTask').onclick=saveTask;$('saveNote').onclick=addNote;
$('addProject').onclick=()=>$('projectModal').classList.add('show');$('closeProject').onclick=()=>hideModal('projectModal');$('saveProject').onclick=addProject;
$('navProjects').onclick=()=>{$('projects').scrollIntoView({behavior:'smooth'})};
$('tasks').onclick=e=>{const toggle=e.target.closest('[data-toggle]');const open=e.target.closest('[data-open]');if(toggle)toggleTask(toggle.dataset.toggle);if(open)editTask(open.dataset.open)};
$('filters').onclick=e=>{const el=e.target.closest('[data-filter]');if(!el)return;filter=el.dataset.filter;[...$('filters').children].forEach(x=>x.classList.toggle('on',x===el));render()};
db.auth.onAuthStateChange(()=>{setTimeout(showSession,0)});showSession();
</script></body></html>
