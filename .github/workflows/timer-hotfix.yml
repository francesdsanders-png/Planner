name: Planner startup hotfix
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/timer-hotfix.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix duplicate declaration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          bad="const val=id=>s[id]||0,val=id=>s[id]||0,weekly="
          good="const val=id=>s[id]||0,weekly="
          if bad not in s:
              raise SystemExit('Duplicate declaration not found')
          p.write_text(s.replace(bad,good,1))
          PY
      - name: Commit hotfix
        run: |
          git config user.name "planner-hotfix"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || (git commit -m "Fix Planner startup error" && git push)
