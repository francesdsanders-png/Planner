name: Timer hotfix
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/timer-hotfix.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair timer initialization
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old="if(!s.timer)s.timer={duration:1200000,remaining:1200000,running:false,startedAt:null,completed:false};"
          new="if(!s.timer||!Number.isFinite(Number(s.timer.duration))||!Number.isFinite(Number(s.timer.remaining))||Number(s.timer.duration)<=0||Number(s.timer.remaining)<0){s.timer={duration:1200000,remaining:1200000,running:false,startedAt:null,completed:false};saveTimerRepair=true}else{s.timer.duration=Number(s.timer.duration);s.timer.remaining=Number(s.timer.remaining);if(s.timer.running&&!Number.isFinite(Number(s.timer.startedAt))){s.timer.running=false;s.timer.startedAt=null}}"
          if old not in s:
              raise SystemExit('Expected timer initializer not found')
          s=s.replace("let s=JSON.parse(localStorage.getItem(key)||'{}');" , "let s=JSON.parse(localStorage.getItem(key)||'{}'),saveTimerRepair=false;")
          s=s.replace(old,new)
          s=s.replace("const save=()=>localStorage.setItem(key,JSON.stringify(s)),", "const save=()=>localStorage.setItem(key,JSON.stringify(s));if(saveTimerRepair)save();const val=id=>s[id]||0,", 1)
          s=s.replace("const val=id=>s[id]||0,weekly=", "weekly=", 1)
          p.write_text(s)
          PY
      - name: Commit hotfix
        run: |
          git config user.name "planner-hotfix"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || (git commit -m "Repair invalid timer state" && git push)
