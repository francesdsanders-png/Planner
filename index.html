onclick="if(event.target===this)closeTimer()"><div class="sheet timerSheet"><div class="grab"></div><button class="close timerClose" onclick="closeTimer()">×</button><div class="timerTitle">Reading</div><div class="timerSub">Focus timer</div><div class="timerControls"><button class="roundAdjust" onclick="adjustTimer(-5)">−</button><div id="timerDial" class="timerDial"><div class="timerInner"><div id="timerBig" class="timerTime">20:00</div></div></div><button class="roundAdjust" onclick="adjustTimer(5)">+</button></div><div class="timerActions"><button onclick="resetTimer()">Reset</button><button id="timerStart" class="primary" onclick="toggleTimer()">Start</button><button onclick="finishTimer()">Done</button></div></div></div><script>const defaults=[['skin','🧴','Morning skin care','Daily','check','Due Now'],['vitc','🍊','Vitamin C','Daily','check','Due Now'],['brush','🪥','Brush & Floss','2 times today','count','Due Now',2],['ears','👂','Clean ears','Daily','check','Due Now'],['plants','🪴','Water plants','Daily','check','Later Today'],['journal','📓','Journal','Once a day','check','Later Today'],['reading','📖','Reading','20 minute timer','timer','Later Today'],['bd','🪟','Close blinds downstairs','Daily','check','Later Today'],['bu','🏠','Close blinds upstairs','Daily','check','Later Today'],['pm','🌙','Night skin care','Daily','check','Later Today'],['mag','💊','Magnesium','Every night','check','Later Today'],['water','🥤','Water cups at night','Daily','check','Later Today'],['exercise','🏋️','Exercise','5 times this week','count','Later Today',5,'weekly'],['stretch','🧘','Stretch','5 times this week','count','Later Today',5,'weekly']];let custom=JSON.parse(localStorage.getItem('planner-custom-habits')||'[]'),tasks=[...defaults,...custom];const ds=()=>new Date().toLocaleDateString('en-CA'),key='planner-v2-'+ds();let s=JSON.parse(localStorage.getItem(key)||'{}');if(!s.timer)s.timer={duration:1200000,remaining:1200000,running:false,startedAt:null,completed:false};if(s.timer.duration==null){s.timer.duration=1200000;s.timer.remaining=1200000;s.timer.running=false;s.timer.startedAt=null;s.timer.completed=false}const save=()=>localStorage.setItem(key,JSON.stringify(s)),val=id=>s[id]||0,weekly=t=>t[7]==='weekly',done=t=>t[4]==='check'?!!s[t[0]]:t[4]==='count'?(weekly(t)?val(t[0])>0:val(t[0])>=t[6]):t[4]==='timer'?!!s.timer.completed:false;function toggle(id){s[id]=!s[id];save();render()}function count(id,d,g){s[id]=Math.max(0,Math.min(g,val(id)+d));save();render()}function remaining(){if(!s.timer.running)return Math.max(0,s.timer.remaining||0);return Math.max(0,(s.timer.remaining||0)-(Date.now()-s.timer.startedAt))}function fmt(ms){let x=Math.ceil(ms/1000);return String(Math.floor(x/60)).padStart(2,'0')+':'+String(x%60).padStart(2,'0')}function openTimer(){timerModal.classList.add('open');paintTimer()}function closeTimer(){if(s.timer.running){s.timer.remaining=remaining();s.timer.startedAt=Date.now();save()}timerModal.classList.remove('open')}function adjustTimer(n){if(s.timer.running)return;let v=Math.max(300000,Math.min(7200000,(s.timer.remaining||1200000)+n*60000));s.timer.duration=v;s.timer.remaining=v;s.timer.completed=false;save();paintTimer()}function toggleTimer(){if(s.timer.running){s.timer.remaining=remaining();s.timer.running=false;s.timer.startedAt=null}else{if(remaining()<=0)s.timer.remaining=s.timer.duration;s.timer.running=true;s.timer.startedAt=Date.now()}save();paintTimer()}function resetTimer(){s.timer.remaining=s.timer.duration||1200000;s.timer.running=false;s.timer.startedAt=null;s.timer.completed=false;save();paintTimer();render()}function finishTimer(){s.timer.remaining=0;s.timer.running=false;s.timer.startedAt=null;s.timer.completed=true;save();closeTimer();render()}function paintTimer(){let r=remaining(),d=s.timer.duration||1200000,p=Math.max(0,Math.min(100,r/d*100));timerBig.textContent=fmt(r);timerDial.style.setProperty('--pct',p+'%');timerStart.textContent=s.timer.running?'Pause':'Start';if(s.timer.running&&r<=0){s.timer.running=false;s.timer.remaining=0;s.timer.completed=true;save();render()}}function item(t,d){let c=t[4]==='check'?'<button class="check '+(d?'done':'')+'" onclick="toggle(\''+t[0]+'\')"></button>':t[4]==='count'?'<div class="count"><button onclick="event.stopPropagation();count(\''+t[0]+'\',-1,'+t[6]+')">−</button><b>'+val(t[0])+'/'+t[6]+'</b><button onclick="event.stopPropagation();count(\''+t[0]+'\',1,'+t[6]+')">+</button></div>':'';let timer=t[4]==='timer';return '<div class="task '+(d?'doneTask ':'')+(timer?'timerTask':'')+'" '+(timer?'onclick="openTimer()"':'')+'><div class="icon">'+t[1]+'</div><div class="info"><div class="name">'+t[2]+'</div><div class="sub">'+(timer?(s.timer.completed?'Completed today':fmt(remaining())+' remaining'):t[3])+'</div></div>'+c+'</div>'}function history(){let out={};for(let i=0;i<35;i++){let d=new Date();d.setDate(d.getDate()-i);let k='planner-v2-'+d.toLocaleDateString('en-CA');out[d.toLocaleDateString('en-CA')]=JSON.parse(localStorage.getItem(k)||'{}')}return out}function isDoneAt(t,z){if(t[4]==='check')return!!z[t[0]];if(t[4]==='count')return t[7]==='weekly'?(z[t[0]]||0)>0:(z[t[0]]||0)>=t[6];if(t[4]==='timer')return!!z.timer?.completed;return false}function renderReports(){let D=tasks.filter(done).length,p=Math.round(D/tasks.length*100);avgPct.textContent=p+'%';avgBar.style.width=p+'%';onTrack.textContent=D+'/'+tasks.length;progressRows.innerHTML=tasks.map(t=>{let q=isDoneAt(t,s)?100:(t[4]==='count'?Math.min(100,Math.round(val(t[0])/t[6]*100)):0);return '<div class="progressRow"><div class="progressTop"><span>'+t[1]+' '+t[2]+'</span><b>'+q+'%</b></div><div class="miniBar"><i style="width:'+q+'%"></i></div><div class="muted">'+(t[4]==='count'?val(t[0])+'/'+t[6]:'Today')+'</div></div>'}).join('');let H=history(),bars='',trs='';for(let i=6;i>=0;i--){let d=new Date();d.setDate(d.getDate()-i);let z=H[d.toLocaleDateString('en-CA')]||{},n=tasks.filter(t=>isDoneAt(t,z)).length,q=Math.round(n/tasks.length*100);bars+='<div class="trendBar" style="height:'+Math.max(4,q)+'%"></div>'}trendBars.innerHTML=bars;trendRows.innerHTML=tasks.map(t=>{let n=0;for(let i=0;i<7;i++){let d=new Date();d.setDate(d.getDate()-i);if(isDoneAt(t,H[d.toLocaleDateString('en-CA')]||{}))n++}return '<div class="trendRow"><span>'+t[1]+' '+t[2]+'<div class="muted">'+n+'/7 times</div></span><b>'+Math.round(n/7*100)+'%</b></div>'}).join('');let now=new Date(),y=now.getFullYear(),m=now.getMonth(),first=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate(),g=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(x=>'<div class="dow">'+x+'</div>').join('');for(let i=0;i<first;i++)g+='<div></div>';let all=0,some=0,zero=0;for(let n=1;n<=days;n++){let d=new Date(y,m,n),future=d>now,z=H[d.toLocaleDateString('en-CA')]||{},c=tasks.filter(t=>isDoneAt(t,z)).length,cl='';if(!future){if(c===tasks.length&&c){cl='all';all++}else if(c){cl='some';some++}else{cl='zero';zero++}}g+='<div class="calday '+cl+'">'+n+'</div>'}calendarGrid.innerHTML=g;calTitle.textContent=now.toLocaleDateString(undefined,{month:'long',year:'numeric'});allDays.textContent=all;someDays.textContent=some;zeroDays.textContent=zero;let total=all+some+zero,q=total?Math.round((all+some)/total*100):0;donut.style.setProperty('--pct',q+'%');donutText.textContent=q+'%'}function render(){tasks=[...defaults,...custom];let D=tasks.filter(done),O=tasks.filter(t=>!done(t)),h='';['Due Now','Later Today'].forEach(g=>{let a=O.filter(t=>t[5]===g);if(a.length)h+='<section class="section"><div class="head"><h2>'+g+'</h2><span class="sub">'+a.length+'</span></div><div class="card">'+a.map(t=>item(t,false)).join('')+'</div></section>'});h+='<section class="section"><div class="head"><h2>Done</h2><span>'+D.length+'</span></div><div class="card">'+(D.length?D.map(t=>item(t,true)).join(''):'<div class="task muted">Nothing completed yet.</div>')+'</div></section>';taskArea.innerHTML=h;let p=Math.round(D.length/tasks.length*100);score.textContent=D.length+'/'+tasks.length+' done';dateLabel.textContent=new Date().toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'});let w='';for(let i=-3;i<=3;i++){let d=new Date();d.setDate(d.getDate()+i);w+='<div class="day">'+d.toLocaleDateString(undefined,{weekday:'short'}).slice(0,2)+'<div class="ring" style="--p:'+(i===0?p:0)+'"><span>'+d.getDate()+'</span></div></div>'}week.innerHTML=w;recList.innerHTML=tasks.map(t=>'<div class="row"><span>'+t[1]+' '+t[2]+'</span><span class="muted">'+t[3]+'</span></div>').join('');renderReports()}let addType='check';function openAdd(){addModal.classList.add('open');setTimeout(()=>habitName.focus(),100)}function closeAdd(){addModal.classList.remove('open');habitName.value=''}document.querySelectorAll('.type').forEach(b=>b.onclick=()=>{document.querySelectorAll('.type').forEach(x=>x.classList.remove('active'));b.classList.add('active');addType=b.dataset.type;goalWrap.style.display=addType==='count'?'block':'none'});function addHabit(){let n=habitName.value.trim();if(!n)return;let id='custom_'+Date.now(),goal=Math.max(1,parseInt(habitGoal.value)||1),sub=addType==='timer'?'Timer':addType==='count'?goal+' times':'Daily',t=[id,addType==='timer'?'⏱️':addType==='count'?'🎯':'✓',n,sub,addType,habitWhen.value];if(addType==='count')t.push(goal);custom.push(t);localStorage.setItem('planner-custom-habits',JSON.stringify(custom));closeAdd();render()}document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));document.getElementById(b.dataset.screen).classList.add('active');render()});document.querySelectorAll('.reportTab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.reportTab').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.reportPane').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.getElementById(b.dataset.report).classList.add('active')});render();setInterval(()=>{if(s.timer.running){paintTimer();if(!timerModal.classList.contains('open'))render()}},500);</script></body></html>
