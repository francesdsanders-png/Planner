<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07080a"><title>Planner</title><style>:root{--bg:#07080a;--panel:#111317;--text:#f5f7fb;--muted:#9da3ae;--line:#24272e;--blue:#0a84ff;--green:#13c46b;--red:#ff3b30}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Roboto,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;font-size:17px;-webkit-tap-highlight-color:transparent}.app{max-width:620px;margin:auto;min-height:100vh;padding:24px 18px 125px}h1{font-size:36px;margin:0 0 5px;letter-spacing:-1px}.muted,.sub{color:var(--muted)}.screen{display:none}.screen.active{display:block}.top{display:flex;justify-content:space-between}.week{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin:22px 0}.day{text-align:center;color:var(--muted);font-size:13px}.ring{--p:0;position:relative;width:46px;height:46px;border-radius:50%;margin:6px auto;background:conic-gradient(var(--blue) calc(var(--p)*1%),#252932 0);display:grid;place-items:center}.ring:after{content:"";position:absolute;inset:4px;background:var(--bg);border-radius:50%}.ring span{z-index:1}.chips,.reportTabs{display:flex;gap:8px;overflow-x:auto}.chip,.reportTab{white-space:nowrap;border:1px solid #303540;background:#11141a;color:#aeb3bd;border-radius:22px;padding:10px 15px;font-size:15px}.chip.active,.reportTab.active{background:#252b38;color:white}.section{margin-top:22px}.head{display:flex;justify-content:space-between;margin:0 2px 10px}.head h2{font-size:19px;margin:0}.card{background:var(--panel);border:1px solid #1f232b;border-radius:20px;overflow:hidden}.task{display:flex;align-items:center;gap:14px;padding:17px 15px;border-bottom:1px solid var(--line);min-height:78px}.task:last-child{border:0}.timerTask{cursor:pointer}.icon{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-size:23px;background:#202738;flex:none}.info{flex:1}.name{font-size:19px;font-weight:600}.check{width:34px;height:34px;border:2px solid #626977;border-radius:50%;background:none}.check.done{background:#6d8fd8;border-color:#6d8fd8}.check.done:after{content:'✓'}.count{display:flex;gap:8px;align-items:center}.count button{border:1px solid #343943;background:#1b1e24;color:white;border-radius:12px;min-width:38px;height:36px;font-size:16px}.doneTask{opacity:.6}.doneTask .name{text-decoration:line-through}.reportTabs{margin:24px 0 22px}.reportPane{display:none}.reportPane.active{display:block}.summary{display:flex;justify-content:space-between;align-items:end;margin:15px 2px}.big{font-size:28px}.bar,.miniBar{height:9px;background:#282d37;border-radius:9px;overflow:hidden}.bar>i,.miniBar i{display:block;height:100%;background:var(--blue)}.progressRow{padding:15px 0;border-bottom:1px solid var(--line)}.progressTop{display:flex;justify-content:space-between;font-size:18px}.calTitle{text-align:center;font-size:22px;margin:8px 0 18px}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:10px 5px;text-align:center}.dow{color:#d7dae0;font-size:14px}.calday{width:39px;height:39px;border-radius:50%;display:grid;place-items:center;margin:auto;color:#777d88}.calday.some{background:var(--blue);color:white}.calday.zero{background:#d93025;color:white}.calday.all{background:var(--green);color:white}.stats{display:grid;grid-template-columns:repeat(3,1fr);text-align:center;margin:28px 0;gap:10px}.stats .num{font-size:34px;color:var(--blue)}.stats .green{color:var(--green)}.stats .red{color:var(--red)}.donut{width:150px;height:150px;border-radius:50%;margin:30px auto;background:conic-gradient(var(--blue) var(--pct),#252a33 0);display:grid;place-items:center;position:relative}.donut:after{content:"";position:absolute;inset:10px;border-radius:50%;background:var(--bg)}.donut span{z-index:1;font-size:31px}.trendBars{height:150px;display:flex;align-items:end;gap:12px;border-bottom:1px solid #303540;margin:10px 0 20px}.trendBar{flex:1;background:var(--blue);min-height:4px;border-radius:5px 5px 0 0}.trendRow{display:flex;justify-content:space-between;padding:13px 2px;border-bottom:1px solid var(--line)}.fab{position:fixed;right:22px;bottom:calc(92px + env(safe-area-inset-bottom));width:60px;height:60px;border:0;border-radius:50%;background:var(--blue);color:white;font-size:36px;z-index:50}.nav{position:fixed;bottom:0;left:0;right:0;background:#08090bf5;border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));z-index:40}.navin{max-width:620px;margin:auto;display:grid;grid-template-columns:repeat(3,1fr)}.nav button{border:0;background:none;color:#8e94a0;padding:8px;font-size:14px}.nav button.active{color:#8db7ff}.simple{margin-top:20px;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:18px}.row{display:flex;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--line)}.modal{position:fixed;inset:0;background:rgba(0,0,0,.72);backdrop-filter:blur(8px);z-index:100;display:none;align-items:flex-end}.modal.open{display:flex}.sheet{width:100%;max-width:620px;margin:auto;background:#12151d;border-radius:28px 28px 0 0;padding:20px 20px calc(26px + env(safe-area-inset-bottom));position:relative}.sheetTop{display:flex;justify-content:space-between;align-items:center}.close,.saveBtn{width:44px;height:44px;border-radius:50%;border:1px solid #363d4b;background:#1a1e27;color:white;font-size:23px}.field{width:100%;background:#1c2029;border:1px solid #2c3240;color:white;border-radius:16px;padding:15px;font-size:18px;margin:15px 0}.types{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.type{border:1px solid #343a47;background:#191d25;color:#c8cdd5;border-radius:14px;padding:13px 5px}.type.active{border-color:#79a8ff;color:#a9c7ff}.label{color:#aeb4bf;margin-top:15px}.timerSheet{min-height:610px;text-align:center;padding:14px 22px calc(32px + env(safe-area-inset-bottom));background:linear-gradient(180deg,#171b25,#0e1118);border:1px solid #252c39;box-shadow:0 -20px 70px #000}.grab{width:54px;height:5px;background:#626977;border-radius:5px;margin:0 auto 24px}.timerTitle{font-size:31px;font-weight:700;margin:20px 0 4px}.timerSub{color:var(--muted);font-size:17px;margin-bottom:26px}.timerControls{display:flex;align-items:center;justify-content:center;gap:13px}.roundAdjust{width:58px;height:58px;border:1px solid #343b48;border-radius:50%;background:#1b202a;color:#fff;font-size:34px}.timerDial{--pct:100%;width:min(62vw,270px);height:min(62vw,270px);border-radius:50%;background:conic-gradient(var(--blue) var(--pct),#29303b 0);padding:12px;display:grid;place-items:center;box-shadow:0 0 34px rgba(10,132,255,.12)}.timerInner{width:100%;height:100%;border-radius:50%;background:#0b0d12;display:grid;place-items:center;border:1px solid #222833}.timerTime{font-size:clamp(48px,14vw,66px);font-weight:400;letter-spacing:-3px}.timerActions{display:flex;justify-content:center;gap:12px;margin-top:28px}.timerActions button{min-width:94px;border:1px solid #343b48;border-radius:18px;background:#20242c;color:white;font-size:18px;padding:14px 20px}.timerActions .primary{background:var(--blue);border-color:var(--blue);font-weight:600}.timerClose{position:absolute;right:20px;top:18px}</style></head><body><div class="app"><div id="today" class="screen active"><div class="top"><div><h1>Planner</h1><div id="dateLabel" class="muted"></div></div><div id="score" class="muted"></div></div><div id="week" class="week"></div><div class="chips"><button class="chip active">All</button><button class="chip">Morning</button><button class="chip">Evening</button><button class="chip">Home</button></div><div id="taskArea"></div></div><div id="progress" class="screen"><h1>Reports</h1><div class="muted">My Goals</div><div class="reportTabs"><button class="reportTab active" data-report="overview">Progress</button><button class="reportTab" data-report="trends">Trends</button><button class="reportTab" data-report="calendar">Calendar</button></div><div id="overview" class="reportPane active"><div class="summary"><div class="big">Average Progress: <b id="avgPct">0%</b></div><div><span id="onTrack">0/0</span><div class="muted">done today</div></div></div><div class="bar"><i id="avgBar"></i></div><div id="progressRows"></div></div><div id="trends" class="reportPane"><div class="trendBars" id="trendBars"></div><div class="calTitle">This Week</div><div id="trendRows"></div></div><div id="calendar" class="reportPane"><div id="calTitle" class="calTitle"></div><div id="calendarGrid" class="calendar"></div><div class="stats"><div>All Done<div class="num green" id="allDays">0</div></div><div>Some Done<div class="num" id="someDays">0</div></div><div>Zero Done<div class="num red" id="zeroDays">0</div></div></div><div class="donut" id="donut"><span id="donutText">0%</span></div></div></div><div id="recurring" class="screen"><h1>Recurring</h1><div id="recList" class="simple"></div></div></div><button class="fab" onclick="openAdd()">+</button><nav class="nav"><div class="navin"><button class="active" data-screen="today">●<br>Today</button><button data-screen="progress">▥<br>Reports</button><button data-screen="recurring">↻<br>Recurring</button></div></nav><div id="addModal" class="modal"><div class="sheet"><div class="sheetTop"><button class="close" onclick="closeAdd()">×</button><h2>Add Habit</h2><button class="saveBtn" onclick="addHabit()">›</button></div><input id="habitName" class="field" placeholder="Name your habit"><div class="label">Track as</div><div class="types"><button class="type active" data-type="check">✓ Habit</button><button class="type" data-type="count">＋ Number</button><button class="type" data-type="timer">◷ Timer</button></div><div id="goalWrap" style="display:none"><input id="habitGoal" class="field" type="number" min="1" value="1"></div><select id="habitWhen" class="field"><option>Due Now</option><option>Later Today</option></select></div></div><div id="timerModal" class="modal" onclick="if(event.target===this)closeTimer()"><div class="sheet timerSheet"><div class="grab"></div><button class="close timerClose" onclick="closeTimer()">×</button><div class="timerTitle">Reading</div><div class="timerSub">20 minute focus session</div><div class="timerControls"><button class="roundAdjust" onclick="adjustTimer(-5)">−</button><div id="timerDial" class="timerDial"><div class="timerInner"><div id="timerBig" class="timerTime">20:00</div></div></div><button class="roundAdjust" onclick="adjustTimer(5)">+</button></div><div class="timerActions"><button onclick="resetTimer()">Reset</button><button id="timerStart" class="primary" onclick="toggleTimer()">Start</button><button onclick="finishTimer()">End</button></div></div></div><script>const defaults=[['skin','🧴','Morning skin care','Daily','check','Due Now'],['vitc','🍊','Vitamin C','Daily','check','Due Now'],['brush','🪥','Brush & Floss','2 times today','count','Due Now',2],['ears','👂','Clean ears','Daily','check','Due Now'],['plants','🪴','Water plants','Daily','check','Later Today'],['journal','📓','Journal','Once a day','check','Later Today'],['reading','📖','Reading','20 minute timer','timer','Later Today'],['bd','🪟','Close blinds downstairs','Daily','check','Later Today'],['bu','🏠','Close blinds upstairs','Daily','check','Later Today'],['pm','🌙','Night skin care','Daily','check','Later Today'],['mag','💊','Magnesium','Every night','check','Later Today'],['water','🥤','Water cups at night','Daily','check','Later Today'],['exercise','🏋️','Exercise','5 times this week','count','Later Today',5,'weekly'],['stretch','🧘','Stretch','5 times this week','count','Later Today',5,'weekly']];let custom=JSON.parse(localStorage.getItem('planner-custom-habits')||'[]'),tasks=[...defaults,...custom];const ds=()=>new Date().toLocaleDateString('en-CA'),key='planner-v2-'+ds();let s=JSON.parse(localStorage.getItem(key)||'{}'),saveTimerRepair=false;if(!s.timer||!Number.isFinite(Number(s.timer.duration))||!Number.isFinite(Number(s.timer.remaining))||Number(s.timer.duration)<=0||Number(s.timer.remaining)<0){s.timer={duration:1200000,remaining:1200000,running:false,startedAt:null,completed:false};saveTimerRepair=true}else{s.timer.duration=Number(s.timer.duration);s.timer.remaining=Number(s.timer.remaining);if(s.timer.running&&!Number.isFinite(Number(s.timer.startedAt))){s.timer.running=false;s.timer.startedAt=null}}const save=()=>localStorage.setItem(key,JSON.stringify(s));if(saveTimerRepair)save();const val=id=>s[id]||0,weekly=t=>t[7]==='weekly',done=t=>t[4]==='check'?!!s[t[0]]:t[4]==='count'?(weekly(t)?val(t[0])>0:val(t[0])>=t[6]):t[4]==='timer'?!!s.timer.completed:false;function toggle(id){s[id]=!s[id];save();render()}function count(id,d,g){s[id]=Math.max(0,Math.min(g,val(id)+d));save();render()}function remaining(){return s.timer.running?Math.max(0,s.timer.remaining-(Date.now()-s.timer.startedAt)):Math.max(0,s.timer.remaining)}function fmt(ms){let x=Math.ceil(ms/1000);return String(Math.floor(x/60)).padStart(2,'0')+':'+String(x%60).padStart(2,'0')}function openTimer(){timerModal.classList.add('open');paintTimer()}function closeTimer(){if(s.timer.running){s.timer.remaining=remaining();s.timer.startedAt=Date.now();save()}timerModal.classList.remove('open')}function adjustTimer(n){if(s.timer.running)return;let v=Math.max(300000,Math.min(7200000,s.timer.remaining+n*60000));s.timer.duration=v;s.timer.remaining=v;s.timer.completed=false;save();paintTimer()}function toggleTimer(){if(s.timer.running){s.timer.remaining=remaining();s.timer.running=false;s.timer.startedAt=null}else{if(remaining()<=0)s.timer.remaining=s.timer.duration;s.timer.running=true;s.timer.startedAt=Date.now()}save();paintTimer()}function resetTimer(){s.timer.remaining=s.timer.duration;s.timer.running=false;s.timer.startedAt=null;s.timer.completed=false;save();paintTimer();render()}function finishTimer(){s.timer.remaining=0;s.timer.running=false;s.timer.startedAt=null;s.timer.completed=true;save();closeTimer();render()}function paintTimer(){let r=remaining(),d=s.timer.duration||1200000,p=Math.max(0,Math.min(100,r/d*100));timerBig.textContent=fmt(r);timerDial.style.setProperty('--pct',p+'%');timerStart.textContent=s.timer.running?'Pause':'Start';if(s.timer.running&&r<=0){s.timer.running=false;s.timer.remaining=0;s.timer.completed=true;save();render()}}function item(t,d){let c=t[4]==='check'?'<button class="check '+(d?'done':'')+'" onclick="toggle(\''+t[0]+'\')"></button>':t[4]==='count'?'<div class="count"><button onclick="event.stopPropagation();count(\''+t[0]+'\',-1,'+t[6]+')">−</button><b>'+val(t[0])+'/'+t[6]+'</b><button onclick="event.stopPropagation();count(\''+t[0]+'\',1,'+t[6]+')">+</button></div>':'';let timer=t[4]==='timer';return '<div class="task '+(d?'doneTask ':'')+(timer?'timerTask':'')+'" '+(timer?'onclick="openTimer()"':'')+'><div class="icon">'+t[1]+'</div><div class="info"><div class="name">'+t[2]+'</div><div class="sub">'+(timer?(s.timer.completed?'Completed today':'Tap to start · '+fmt(remaining())):t[3])+'</div></div>'+c+'</div>'}function renderReports(){let D=tasks.filter(done).length,p=Math.round(D/tasks.length*100);avgPct.textContent=p+'%';avgBar.style.width=p+'%';onTrack.textContent=D+'/'+tasks.length;progressRows.innerHTML=tasks.map(t=>'<div class="progressRow"><div class="progressTop"><span>'+t[1]+' '+t[2]+'</span><b>'+(done(t)?'100%':'0%')+'</b></div><div class="miniBar"><i style="width:'+(done(t)?100:0)+'%"></i></div></div>').join('')}function render(){tasks=[...defaults,...custom];let D=tasks.filter(done),O=tasks.filter(t=>!done(t)),h='';['Due Now','Later Today'].forEach(g=>{let a=O.filter(t=>t[5]===g);if(a.length)h+='<section class="section"><div class="head"><h2>'+g+'</h2><span class="sub">'+a.length+'</span></div><div class="card">'+a.map(t=>item(t,false)).join('')+'</div></section>'});h+='<section class="section"><div class="head"><h2>Done</h2><span>'+D.length+'</span></div><div class="card">'+(D.length?D.map(t=>item(t,true)).join(''):'<div class="task muted">Nothing completed yet.</div>')+'</div></section>';taskArea.innerHTML=h;score.textContent=D.length+'/'+tasks.length+' done';dateLabel.textContent=new Date().toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'});let p=Math.round(D.length/tasks.length*100),w='';for(let i=-3;i<=3;i++){let d=new Date();d.setDate(d.getDate()+i);w+='<div class="day">'+d.toLocaleDateString(undefined,{weekday:'short'}).slice(0,2)+'<div class="ring" style="--p:'+(i===0?p:0)+'"><span>'+d.getDate()+'</span></div></div>'}week.innerHTML=w;recList.innerHTML=tasks.map(t=>'<div class="row"><span>'+t[1]+' '+t[2]+'</span><span class="muted">'+t[3]+'</span></div>').join('');renderReports()}let addType='check';function openAdd(){addModal.classList.add('open');setTimeout(()=>habitName.focus(),100)}function closeAdd(){addModal.classList.remove('open');habitName.value=''}document.querySelectorAll('.type').forEach(b=>b.onclick=()=>{document.querySelectorAll('.type').forEach(x=>x.classList.remove('active'));b.classList.add('active');addType=b.dataset.type;goalWrap.style.display=addType==='count'?'block':'none'});function addHabit(){let n=habitName.value.trim();if(!n)return;let id='custom_'+Date.now(),goal=Math.max(1,parseInt(habitGoal.value)||1),sub=addType==='timer'?'Timer':addType==='count'?goal+' times':'Daily',t=[id,addType==='timer'?'⏱️':addType==='count'?'🎯':'✓',n,sub,addType,habitWhen.value];if(addType==='count')t.push(goal);custom.push(t);localStorage.setItem('planner-custom-habits',JSON.stringify(custom));closeAdd();render()}document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));document.getElementById(b.dataset.screen).classList.add('active');render()});document.querySelectorAll('.reportTab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.reportTab').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.reportPane').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.getElementById(b.dataset.report).classList.add('active')});render();setInterval(()=>{if(s.timer.running){paintTimer();if(!timerModal.classList.contains('open'))render()}},500);</script></body></html>
