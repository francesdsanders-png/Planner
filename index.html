<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f7f4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Planner">
<title>Planner</title>
<style>
:root{--bg:#f7f7f4;--card:#fff;--text:#171816;--muted:#777a73;--daily:#dceaff;--weekly:#eee3ff;--monthly:#ffe9d2;--biweekly:#dff3e8;--health:#ffe1e8}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif}
.app{max-width:520px;margin:auto;min-height:100vh;padding:calc(env(safe-area-inset-top) + 18px) 18px calc(env(safe-area-inset-bottom) + 90px)}
.top{display:flex;justify-content:space-between;align-items:center}.eyebrow{font-size:12px;font-weight:750;letter-spacing:.08em;color:var(--muted)}
h1{font-size:31px;margin:5px 0 3px}.sub,.meta{color:var(--muted)}.sub{font-size:14px}.meta{font-size:11px;margin-top:3px}
.add{width:44px;height:44px;border:0;border-radius:50%;background:#171816;color:#fff;font-size:26px}
.legend{display:flex;gap:12px;overflow:auto;padding:22px 0 14px;font-size:11px;color:var(--muted);white-space:nowrap}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:4px}.daily{background:var(--daily)}.weekly{background:var(--weekly)}.monthly{background:var(--monthly)}.biweekly{background:var(--biweekly)}.health{background:var(--health)}
.section{margin:8px 0 23px}.section-head{font-size:17px;font-weight:780;margin-bottom:8px}
.task{background:var(--card);display:flex;align-items:center;gap:12px;padding:11px 12px;margin:8px 0;border-radius:18px}
.icon{width:45px;height:45px;border-radius:50%;display:grid;place-items:center;font-size:21px;flex:none}.info{min-width:0;flex:1}.name{font-size:15px;font-weight:650}
.done{border:0;background:#f0f2ee;color:#30322e;font-weight:700;border-radius:12px;padding:10px 11px}
.empty{text-align:center;padding:55px 20px}.hidden{display:none!important}
nav{position:fixed;bottom:0;left:0;right:0;background:#f7f7f4ee;border-top:1px solid #e8e9e4;padding:9px 16px calc(env(safe-area-inset-bottom) + 7px);display:flex;justify-content:center;gap:55px;font-size:11px;color:var(--muted)}
nav span{text-align:center}nav i{display:block;font-style:normal;font-size:20px}nav b{color:var(--text)}
</style></head>
<body><main class="app">
<div class="top"><div><div class="eyebrow" id="day"></div><h1>My Day</h1><div class="sub" id="remaining"></div></div><button class="add" onclick="alert('Adding routines is coming next.')">+</button></div>
<div class="legend"><span><i class="dot daily"></i>Daily</span><span><i class="dot weekly"></i>Weekly</span><span><i class="dot biweekly"></i>Every other week</span><span><i class="dot monthly"></i>Monthly</span><span><i class="dot health"></i>Health</span></div>
<div id="list"></div><div id="empty" class="empty hidden"><div style="font-size:42px">✨</div><h2>You're clear.</h2><div class="sub">Everything due today is done.</div></div>
</main><nav><span><i>☀️</i><b>Today</b></span><span><i>📈</i>Progress</span><span><i>🔁</i>Recurring</span></nav>
<script>
const R=[
["brush-am","🪥","Brush & floss · morning","daily","Daily"],["skin-am","🧴","Morning skin care","daily","Daily"],["vitc","🍊","Vitamin C","daily","Daily"],["sun","☀️","Sunscreen","daily","Daily"],["ears","👂","Clean ears","daily","Daily"],["journal","📓","Journal","daily","Daily"],["plants","🪴","Water plants","daily","Daily"],["blinds-down","🪟","Close blinds downstairs","daily","Daily"],["blinds-up","🏠","Close blinds upstairs","daily","Daily"],["skin-pm","🌙","Night skin care","daily","Daily"],["mag","💊","Magnesium","daily","Nightly"],["water","🥤","Water cups at night","daily","Daily"],["brush-pm","🦷","Brush & floss · night","daily","Daily"],
["exercise","🏋️","Exercise","goal","5× this week"],["stretch","🧘","Stretch","goal","5× this week"],
["laundry","🧺","Laundry","weekday","Friday",5],["towel","🧖","Change towel","weekday","Friday",5],["microwave","♨️","Clean microwave","weekday","Friday",5],["fridge-out","🧼","Clean outside of fridge","weekday","Friday",5],
["nails","💅","Cut fingernails","weekday","Saturday",6],["trash","🗑️","Take out trash upstairs","weekday","Saturday",6],["rags","🧻","Wash kitchen rags","weekday","Saturday",6],["keurig","☕","Clean water for Keurig","weekday","Saturday",6],["fridge-water","🚰","Clean water inside fridge","weekday","Saturday",6],["tub","🛁","Scrub the tub","weekday","Saturday",6],["mop","🧹","Mop","weekday","Saturday",6],
["gas-toyota","⛽","Gas Toyota","weekday","Sunday",0],["gas-lexus","⛽️","Gas Lexus","weekday","Sunday",0],["phone","📱","Clean phone case","weekday","Sunday",0],["airpods","🎧","Clean AirPods case","weekday","Sunday",0],["family","👨‍👩‍👧","Update family board","weekday","Sunday",0],
["mail","📬","Check mailbox","weekday","Monday",1],["face","🫧","Face scrub","weekday","Monday",1],["shave","🪒","Shave","weekday","Monday",1],
["brows","👁️","Eyebrows","monthday","1st of month",1],["hair","💈","Haircut","monthday","1st of month",1],["runners","👟","Wash runners","monthday","1st of month",1],["razor","🪒","Change razor","monthday","1st of month",1],["toothbrush","🪥","Change toothbrush","monthday","1st of month",1],["wash-lexus","🚙","Car wash Lexus","monthday","5th of month",5],["wash-toyota","🚗","Car wash Toyota","monthday","5th of month",5]
];
const now=new Date(), dayKey=now.toLocaleDateString("en-CA");
let d=new Date(now);d.setDate(d.getDate()-((d.getDay()+6)%7));const weekKey=d.toLocaleDateString("en-CA");
let done=JSON.parse(localStorage.getItem("plannerDone")||"{}"),counts=JSON.parse(localStorage.getItem("plannerCounts")||"{}");
const due=r=>r[3]==="daily"||r[3]==="goal"||(r[3]==="weekday"&&now.getDay()===r[5])||(r[3]==="monthday"&&now.getDate()===r[5]);
const complete=r=>r[3]==="goal"?(counts[weekKey+"-"+r[0]]||0)>=5:!!done[dayKey+"-"+r[0]];
const cls=r=>r[3]==="daily"?"daily":r[3]==="monthday"?"monthly":"weekly";
const section=r=>r[3]==="goal"?"This week":(r[0]==="tub"||r[0]==="mop")?"Bathroom":r[3]==="daily"?"Daily":r[4];
function render(){
 document.getElementById("day").textContent=now.toLocaleDateString(undefined,{weekday:"long",month:"short",day:"numeric"}).toUpperCase();
 const active=R.filter(r=>due(r)&&!complete(r));document.getElementById("remaining").textContent=active.length+(active.length===1?" thing left":" things left");
 const groups={};active.forEach(r=>(groups[section(r)]??=[]).push(r));let h="";
 for(const [g,items] of Object.entries(groups)){h+=`<section class="section"><div class="section-head">${g}</div>`;items.forEach(r=>{let m=r[3]==="goal"?(counts[weekKey+"-"+r[0]]||0)+" / 5 this week":r[4];h+=`<div class="task"><div class="icon ${cls(r)}">${r[1]}</div><div class="info"><div class="name">${r[2]}</div><div class="meta">${m}</div></div><button class="done" onclick="finish('${r[0]}')">${r[3]==="goal"?"+1":"Done"}</button></div>`});h+="</section>"}
 document.getElementById("list").innerHTML=h;document.getElementById("empty").classList.toggle("hidden",active.length>0)
}
function finish(id){const r=R.find(x=>x[0]===id);if(r[3]==="goal"){const k=weekKey+"-"+id;counts[k]=(counts[k]||0)+1;localStorage.setItem("plannerCounts",JSON.stringify(counts))}else{done[dayKey+"-"+id]=1;localStorage.setItem("plannerDone",JSON.stringify(done))}render()}
render();
</script></body></html>
