<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07080a"><title>Planner</title><style>:root{--bg:#07080a;--panel:#111317;--text:#f5f7fb;--muted:#a6acb7;--line:#252932;--blue:#3b82f6}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Roboto,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;font-size:18px}.app{max-width:620px;margin:auto;min-height:100vh;padding:28px 20px 130px}h1{font-size:40px;margin:0 0 6px}.muted,.sub{color:var(--muted)}.screen{display:none}.screen.active{display:block}.top{display:flex;justify-content:space-between}.week{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin:24px 0}.day{text-align:center;color:var(--muted);font-size:14px}.ring{width:48px;height:48px;border-radius:50%;margin:7px auto;background:#171a20;display:grid;place-items:center;border:1px solid #2b3039}.chips{display:flex;gap:9px;overflow:auto}.chip{border:1px solid #343945;background:#11141a;color:#b7bdc7;border-radius:24px;padding:12px 17px;font-size:17px}.chip.active{background:#293040;color:white}.section{margin-top:25px}.head{display:flex;justify-content:space-between;margin:0 3px 11px}.head h2{font-size:21px;margin:0}.card{background:var(--panel);border:1px solid #232730;border-radius:22px;overflow:hidden}.task{display:flex;align-items:center;gap:15px;padding:18px 16px;border-bottom:1px solid var(--line);min-height:82px}.task:last-child{border:0}.icon{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-size:24px;background:#202738;flex:none}.info{flex:1}.name{font-size:20px;font-weight:650}.sub{font-size:16px;margin-top:3px}.check{width:40px;height:40px;border:2px solid #69717f;border-radius:50%;background:none;color:white}.count{display:flex;gap:9px;align-items:center}.count button{border:1px solid #3a404b;background:#1b1e24;color:white;border-radius:13px;width:42px;height:42px;font-size:21px}.weeklyCircle{--p:0;width:54px;height:54px;border-radius:50%;background:conic-gradient(var(--blue) calc(var(--p)*1%),#2a303a 0);padding:5px;display:grid;place-items:center;flex:none}.weeklyCircle span{width:100%;height:100%;border-radius:50%;background:#11151c;display:grid;place-items:center;font-size:14px;font-weight:700}.progressCard,.simple{margin-top:22px;background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:18px}.progressRow,.row{padding:15px 0;border-bottom:1px solid var(--line)}.progressTop,.row{display:flex;justify-content:space-between;gap:15px}.miniBar{height:8px;background:#292e38;border-radius:8px;margin-top:9px;overflow:hidden}.miniBar i{display:block;height:100%;background:var(--blue)}.fab{position:fixed;right:24px;bottom:calc(98px + env(safe-area-inset-bottom));width:66px;height:66px;border:0;border-radius:50%;background:var(--blue);color:white;font-size:40px;z-index:50}.nav{position:fixed;bottom:0;left:0;right:0;background:#08090bf5;border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));z-index:40}.navin{max-width:620px;margin:auto;display:grid;grid-template-columns:repeat(3,1fr)}.nav button{border:0;background:none;color:#969ca7;padding:8px;font-size:16px}.nav button.active{color:#8db7ff}.modal{position:fixed;inset:0;background:#000c;z-index:100;display:none;align-items:flex-end}.modal.open{display:flex}.sheet{width:100%;max-width:620px;margin:auto;background:#131720;border-radius:30px 30px 0 0;padding:22px 22px calc(30px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto}.sheetTop{display:flex;justify-content:space-between;align-items:center}.close,.saveBtn{width:50px;height:50px;border-radius:50%;border:1px solid #3a414e;background:#1b202a;color:white;font-size:25px}.field{width:100%;background:#1c2029;border:1px solid #303746;color:white;border-radius:17px;padding:17px;font-size:20px;margin:12px 0}.label{display:block;color:#a6acb7;font-size:16px;margin:16px 2px 2px}.types{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.type{border:1px solid #3a414e;background:#191d25;color:#d0d5dd;border-radius:15px;padding:16px 6px}.type.active{border-color:#79a8ff}.timerSheet{text-align:center}.timerTime{font-size:72px;margin:32px 0}.timerAdjust,.timerActions{display:flex;justify-content:center;gap:12px}.timerAdjust button,.timerActions button{border:1px solid #3a414e;border-radius:16px;background:#1d222b;color:white;font-size:19px;padding:14px 20px}.timerActions{margin-top:24px}.primary{background:var(--blue)!important}</style></head><body><div class="app"><div id="today" class="screen active"><div class="top"><div><h1>Planner</h1><div id="dateLabel" class="muted"></div></div><div id="score" class="muted"></div></div><div id="week" class="week"></div><div class="chips"><button class="chip active">All</button><button class="chip">Morning</button><button class="chip">Evening</button><button class="chip">Home</button></div><div id="taskArea"></div></div><div id="progress" class="screen"><h1>Reports</h1><div class="muted">Your progress</div><div id="progressRows" class="progressCard"></div></div><div id="recurring" class="screen"><h1>Recurring</h1><div id="recList" class="simple"></div></div></div><button class="fab" id="fab">+</button><nav class="nav"><div class="navin"><button class="active" data-screen="today">●<br>Today</button><button data-screen="progress">▥<br>Reports</button><button data-screen="recurring">↻<br>Recurring</button></div></nav><div id="addModal" class="modal"><div class="sheet"><div class="sheetTop"><button class="close" id="closeAdd">×</button><h2>Add Habit</h2><button class="saveBtn" id="saveHabit">✓</button></div><input id="habitName" class="field" placeholder="Name your habit"><div class="types"><button class="type active" data-type="check">✓ Habit</button><button class="type" data-type="count">＋ Number</button><button class="type" data-type="timer">◷ Timer</button></div><div id="goalWrap" style="display:none"><input id="habitGoal" class="field" type="number" min="1" value="1"></div><label class="label" for="habitRepeat">Repeat</label><select id="habitRepeat" class="field"><option value="daily">Every day</option><option value="dow:1">Every Monday</option><option value="dow:2">Every Tuesday</option><option value="dow:3">Every Wednesday</option><option value="dow:4">Every Thursday</option><option value="dow:5">Every Friday</option><option value="dow:6">Every Saturday</option><option value="dow:0">Every Sunday</option><option value="weekly">Weekly goal</option><option value="biweekly">Every 2 weeks</option><option value="dom:1">1st of every month</option><option value="monthly-date">Monthly on a date…</option></select><div id="monthDayWrap" style="display:none"><label class="label" for="monthDay">Day of month</label><input id="monthDay" class="field" type="number" min="1" max="31" value="1"></div><label class="label" for="habitWhen">When it is due</label><select id="habitWhen" class="field"><option>Due Now</option><option>Later Today</option></select></div></div><div id="timerModal" class="modal"><div class="sheet timerSheet"><div class="sheetTop"><button class="close" id="closeTimer">×</button><h2>Reading</h2><span style="width:50px"></span></div><div id="timerBig" class="timerTime">20:00</div><div class="timerAdjust"><button id="minusTimer">− 5 min</button><button id="plusTimer">+ 5 min</button></div><div class="timerActions"><button id="resetTimer">Reset</button><button id="timerStart" class="primary">Start</button><button id="finishTimer">End</button></div></div></div><script>const defaults=[['skin','🧴','Morning skin care','Daily','check','Due Now'],['vitc','🍊','Vitamin C','Daily','check','Due Now'],['brush','🪥','Brush & Floss','2 times today','count','Due Now',2],['ears','👂','Clean ears','Daily','check','Due Now'],['plants','🪴','Water plants','Daily','check','Later Today'],['journal','📓','Journal','Once a day','check','Later Today'],['reading','📖','Reading','20 minute timer','timer','Later Today'],['bd','🪟','Close blinds downstairs','Daily','check','Later Today'],['bu','🏠','Close blinds upstairs','Daily','check','Later Today'],['pm','🌙','Night skin care','Daily','check','Later Today'],['mag','💊','Magnesium','Every night','check','Later Today'],['water','🥤','Water cups at night','Daily','check','Later Today'],['exercise','🏋️','Exercise','5 times this week','count','Later Today',5,'weekly'],['stretch','🧘','Stretch','5 times this week','count','Later Today',5,'weekly']];const scheduled=[['mail','📬','Check mailbox','Every Monday','check','Later Today',null,'dow:1'],['facescrub','🧼','Face scrub','Every Monday','check','Later Today',null,'dow:1'],['shave','🪒','Shave','Every Monday','check','Later Today',null,'dow:1'],['laundry','🧺','Laundry','Every Friday','check','Later Today',null,'dow:5'],['towel','🧻','Change towel','Every Friday','check','Later Today',null,'dow:5'],['microwave','🧽','Clean microwave','Every Friday','check','Later Today',null,'dow:5'],['fridgeout','🧽','Clean outside of fridge','Every Friday','check','Later Today',null,'dow:5'],['blankets','🛏️','Wash blankets','Every other Friday','check','Later Today',null,'biweekly:5:2026-09-25'],['nails','✂️','Cut fingernails','Every Saturday','check','Later Today',null,'dow:6'],['uptrash','🗑️','Upstairs trash','Every Saturday','check','Later Today',null,'dow:6'],['mop','🧹','Mop','Every Saturday','check','Later Today',null,'dow:6'],['tub','🛁','Scrub tub','Every Saturday','check','Later Today',null,'dow:6'],['rags','🧺','Wash kitchen rags','Every Saturday','check','Later Today',null,'dow:6'],['keurig','☕','Clean Keurig water area','Every Saturday','check','Later Today',null,'dow:6'],['fridgewater','🚰','Clean fridge water area','Every Saturday','check','Later Today',null,'dow:6'],['gastoyota','⛽','Gas Toyota','Every Sunday','check','Later Today',null,'dow:0'],['gaslexus','⛽','Gas Lexus','Every Sunday','check','Later Today',null,'dow:0'],['cases','📱','Clean phone/AirPods cases','Every Sunday','check','Later Today',null,'dow:0'],['familyboard','🗓️','Update family board','Every Sunday','check','Later Today',null,'dow:0'],['eyebrows','✨','Eyebrows','1st of every month','check','Later Today',null,'dom:1'],['haircut','💈','Haircut','1st of every month','check','Later Today',null,'dom:1'],['runners','👟','Wash runners','1st of every month','check','Later Today',null,'dom:1'],['razor','🪒','Change razor','1st of every month','check','Later Today',null,'dom:1'],['washlexus','🚙','Car wash Lexus','5th of every month','check','Later Today',null,'dom:5'],['washtoyota','🚗','Car wash Toyota','5th of every month','check','Later Today',null,'dom:5'],['icemaker','🧊','Clean ice maker','Monthly','check','Later Today',null,'dom:1']];let custom=JSON.parse(localStorage.getItem('planner-custom-habits')||'[]');const dateKey=()=>new Date().toLocaleDateString('en-CA'),dailyKey='planner-v3-'+dateKey();let s=JSON.parse(localStorage.getItem(dailyKey)||'{}');if(!s.timer)s.timer={duration:1200000,remaining:1200000,running:false,startedAt:null,completed:false};function mondayDate(){let d=new Date(),day=(d.getDay()+6)%7;d.setHours(0,0,0,0);d.setDate(d.getDate()-day);return d}function mondayKey(){return 'planner-week-'+mondayDate().toLocaleDateString('en-CA')}const wk=mondayKey();let w=JSON.parse(localStorage.getItem(wk)||'{}');if(wk==='planner-week-2026-09-21'&&!w._exerciseSeed){w.exercise=Math.max(1,Number(w.exercise||0));w._exerciseSeed=true;localStorage.setItem(wk,JSON.stringify(w))}const save=()=>localStorage.setItem(dailyKey,JSON.stringify(s)),saveWeek=()=>localStorage.setItem(wk,JSON.stringify(w));function due(t,d=new Date()){let r=t[7];if(!r||r==='daily')return true;if(r==='weekly')return true;if(r.startsWith('dow:'))return d.getDay()===Number(r.split(':')[1]);if(r.startsWith('dom:'))return d.getDate()===Number(r.split(':')[1]);if(r.startsWith('biweekly:')){let a=r.split(':'),target=Number(a[1]);if(d.getDay()!==target)return false;let anchor=new Date(a[2]+'T12:00:00'),x=new Date(d);x.setHours(12,0,0,0);return Math.round((x-anchor)/86400000)%14===0}return true}const allTasks=()=>[...defaults,...scheduled,...custom],tasks=()=>allTasks().filter(t=>due(t)),weekly=t=>t[7]==='weekly',value=t=>weekly(t)?Number(w[t[0]]||0):Number(s[t[0]]||0),doneToday=t=>weekly(t)?!!s['weeklyDone_'+t[0]]:t[4]==='check'?!!s[t[0]]:t[4]==='count'?value(t)>=t[6]:t[4]==='timer'?!!s.timer.completed:false;function toggle(id){s[id]=!s[id];save();render()}function countTask(t,d){if(weekly(t)){if(d>0&&!s['weeklyDone_'+t[0]]){w[t[0]]=Math.min(t[6],Number(w[t[0]]||0)+1);s['weeklyDone_'+t[0]]=true}else if(d<0&&s['weeklyDone_'+t[0]]){w[t[0]]=Math.max(0,Number(w[t[0]]||0)-1);s['weeklyDone_'+t[0]]=false}saveWeek();save()}else{s[t[0]]=Math.max(0,Math.min(t[6],value(t)+d));save()}render()}function remaining(){return s.timer.running?Math.max(0,s.timer.remaining-(Date.now()-s.timer.startedAt)):Math.max(0,s.timer.remaining)}function fmt(ms){let x=Math.max(0,Math.ceil(ms/1000));return String(Math.floor(x/60)).padStart(2,'0')+':'+String(x%60).padStart(2,'0')}function item(t){let c='';if(t[4]==='check')c='<button class="check" data-toggle="'+t[0]+'"></button>';if(t[4]==='count'&&!weekly(t))c='<div class="count"><button data-id="'+t[0]+'" data-d="-1">−</button><b>'+value(t)+'/'+t[6]+'</b><button data-id="'+t[0]+'" data-d="1">+</button></div>';if(weekly(t)){let p=Math.round(value(t)/t[6]*100);c='<div class="weeklyCircle" style="--p:'+p+'"><span>'+value(t)+'/'+t[6]+'</span></div>'}return '<div class="task" data-timer="'+(t[4]==='timer'?'1':'0')+'"><div class="icon">'+t[1]+'</div><div class="info"><div class="name">'+t[2]+'</div><div class="sub">'+(weekly(t)?'This week · tap circle to log today':t[4]==='timer'?'Tap to open timer':t[3])+'</div></div>'+c+'</div>'}function render(){let d=new Date();dateLabel.textContent=d.toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'});week.innerHTML='';for(let i=0;i<7;i++){let x=new Date(mondayDate());x.setDate(x.getDate()+i);week.innerHTML+='<div class="day">'+x.toLocaleDateString(undefined,{weekday:'short'}).slice(0,2)+'<div class="ring">'+x.getDate()+'</div></div>'}let ts=tasks(),open=ts.filter(t=>!doneToday(t)),done=ts.filter(doneToday);score.textContent=done.length+'/'+ts.length+' done';taskArea.innerHTML=(open.length?'<div class="section"><div class="head"><h2>Today</h2><span>'+open.length+'</span></div><div class="card">'+open.map(item).join('')+'</div></div>':'')+(done.length?'<div class="section"><div class="head"><h2>Done</h2><span>'+done.length+'</span></div><div class="card" style="opacity:.55">'+done.map(item).join('')+'</div></div>':'');progressRows.innerHTML=allTasks().map(t=>{let v=value(t),g=t[6]||1,p=doneToday(t)?100:Math.min(100,Math.round(v/g*100));return '<div class="progressRow"><div class="progressTop"><b>'+t[2]+'</b><span>'+p+'%</span></div><div class="miniBar"><i style="width:'+p+'%"></i></div></div>'}).join('');recList.innerHTML=allTasks().map(t=>'<div class="row"><span>'+t[1]+' '+t[2]+'</span><span class="muted">'+t[3]+'</span></div>').join('');bind()}function bind(){document.querySelectorAll('[data-toggle]').forEach(b=>b.onclick=e=>toggle(e.currentTarget.dataset.toggle));document.querySelectorAll('[data-id][data-d]').forEach(b=>b.onclick=e=>{let t=allTasks().find(x=>x[0]===e.currentTarget.dataset.id);countTask(t,Number(e.currentTarget.dataset.d))});document.querySelectorAll('.weeklyCircle').forEach((b,i)=>{let rows=[...document.querySelectorAll('.weeklyCircle')];b.onclick=()=>{let parent=b.closest('.task'),name=parent.querySelector('.name').textContent,t=allTasks().find(x=>x[2]===name);countTask(t,s['weeklyDone_'+t[0]]?-1:1)}});document.querySelectorAll('[data-timer="1"]').forEach(x=>x.onclick=()=>openTimer())}document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.screen,.nav button').forEach(x=>x.classList.remove('active'));document.getElementById(b.dataset.screen).classList.add('active');b.classList.add('active');fab.style.display=b.dataset.screen==='progress'?'none':'block'});fab.onclick=()=>addModal.classList.add('open');closeAdd.onclick=()=>addModal.classList.remove('open');document.querySelectorAll('.type').forEach(b=>b.onclick=()=>{document.querySelectorAll('.type').forEach(x=>x.classList.remove('active'));b.classList.add('active');goalWrap.style.display=b.dataset.type==='count'?'block':'none'});habitRepeat.onchange=()=>{monthDayWrap.style.display=habitRepeat.value==='monthly-date'?'block':'none';if(habitRepeat.value==='weekly'){goalWrap.style.display='block';habitGoal.value=Math.max(1,Number(habitGoal.value||1))}};saveHabit.onclick=()=>{let n=habitName.value.trim();if(!n)return;let ty=document.querySelector('.type.active').dataset.type,g=ty==='count'?Math.max(1,Number(habitGoal.value||1)):null,r=habitRepeat.value,desc='Every day';if(r==='monthly-date')r='dom:'+Math.max(1,Math.min(31,Number(monthDay.value||1)));if(r==='biweekly'){let now=new Date(),dow=now.getDay();r='biweekly:'+dow+':'+now.toLocaleDateString('en-CA')}const names={'daily':'Every day','dow:0':'Every Sunday','dow:1':'Every Monday','dow:2':'Every Tuesday','dow:3':'Every Wednesday','dow:4':'Every Thursday','dow:5':'Every Friday','dow:6':'Every Saturday','weekly':'Weekly goal','dom:1':'1st of every month'};desc=names[r]||(r.startsWith('dom:')?ordinal(Number(r.split(':')[1]))+' of every month':r.startsWith('biweekly:')?'Every 2 weeks':'Recurring');if(r==='weekly'){ty='count';g=Math.max(1,Number(habitGoal.value||1));desc=g+' times this week'}let id='c'+Date.now();custom.push([id,'✨',n,desc,ty,habitWhen.value,g,r]);localStorage.setItem('planner-custom-habits',JSON.stringify(custom));habitName.value='';habitRepeat.value='daily';monthDayWrap.style.display='none';addModal.classList.remove('open');render()};function ordinal(n){let s=['th','st','nd','rd'],v=n%100;return n+(s[(v-20)%10]||s[v]||s[0])}function openTimer(){timerModal.classList.add('open');timerBig.textContent=fmt(remaining())}closeTimer.onclick=()=>timerModal.classList.remove('open');minusTimer.onclick=()=>{s.timer.duration=Math.max(300000,s.timer.duration-300000);s.timer.remaining=s.timer.duration;s.timer.running=false;save();timerBig.textContent=fmt(remaining())};plusTimer.onclick=()=>{s.timer.duration+=300000;s.timer.remaining=s.timer.duration;s.timer.running=false;save();timerBig.textContent=fmt(remaining())};timerStart.onclick=()=>{if(s.timer.running){s.timer.remaining=remaining();s.timer.running=false;s.timer.startedAt=null;timerStart.textContent='Start'}else{s.timer.running=true;s.timer.startedAt=Date.now();timerStart.textContent='Pause'}save()};resetTimer.onclick=()=>{s.timer.running=false;s.timer.remaining=s.timer.duration;s.timer.startedAt=null;s.timer.completed=false;save();timerBig.textContent=fmt(remaining());timerStart.textContent='Start'};finishTimer.onclick=()=>{s.timer.running=false;s.timer.remaining=0;s.timer.completed=true;save();timerModal.classList.remove('open');render()};setInterval(()=>{if(timerModal.classList.contains('open')){let r=remaining();timerBig.textContent=fmt(r);if(r<=0&&s.timer.running){s.timer.running=false;s.timer.remaining=0;s.timer.completed=true;save();render()}}},500);render();</script></body></html>
