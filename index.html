<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07080a"><title>Planner</title><style>:root{--bg:#07080a;--panel:#111317;--text:#f5f7fb;--muted:#9da3ae;--line:#24272e;--blue:#79a8ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Roboto,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;-webkit-tap-highlight-color:transparent;font-size:17px}.app{max-width:620px;margin:auto;min-height:100vh;padding:24px 18px 118px}.top{display:flex;justify-content:space-between;align-items:flex-start}.top h1,.screen>h1{font-size:36px;letter-spacing:-1.2px;margin:0 0 5px}.date,.score,.sub{color:var(--muted);font-size:16px}.score{padding-top:10px}.week{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin:24px 0 19px}.day{text-align:center;color:var(--muted);font-size:13px}.ring{--p:0;position:relative;width:46px;height:46px;border-radius:50%;margin:7px auto;background:conic-gradient(var(--blue) calc(var(--p)*1%),#262930 0);display:grid;place-items:center}.ring:after{content:"";position:absolute;inset:4px;background:var(--bg);border-radius:50%}.ring span{z-index:1;color:var(--text);font-size:16px}.chips{display:flex;gap:9px;overflow:auto}.chip{border:1px solid var(--line);background:#111318;color:#c3c8d1;border-radius:22px;padding:10px 15px;font-size:15px}.chip.active{background:#dce8ff;color:#111827}.section{margin-top:22px}.head{display:flex;justify-content:space-between;margin:0 2px 11px}.head h2{font-size:18px;margin:0}.card{background:var(--panel);border:1px solid #1b1e24;border-radius:20px;overflow:hidden}.task{display:flex;align-items:center;gap:14px;padding:17px 15px;border-bottom:1px solid var(--line);min-height:78px}.task:last-child{border:0}.icon{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-size:23px;background:#202738;flex:none}.info{flex:1;min-width:0}.name{font-size:19px;font-weight:600;line-height:1.25}.check{width:34px;height:34px;border:2px solid #626977;border-radius:50%;background:transparent;color:#101318;font-size:18px}.check.done{background:var(--blue);border-color:var(--blue)}.check.done:after{content:"✓"}.count,.timerBtns{display:flex;align-items:center;gap:8px}.count button,.timerBtns button{border:1px solid #343943;background:#1b1e24;color:var(--text);border-radius:12px;min-width:38px;height:36px;font-size:16px}.count b{min-width:36px;text-align:center;font-size:16px}.timer{margin-top:10px}.clock{font-variant-numeric:tabular-nums;font-weight:700;font-size:18px}.timerBtns{margin-top:9px}.timerBtns .primary{background:#dce8ff;color:#101318}.doneTask{opacity:.62}.doneTask .name{text-decoration:line-through}.fab{position:fixed;right:22px;bottom:91px;width:58px;height:58px;border:0;border-radius:50%;background:#0a84ff;color:white;font-size:34px;box-shadow:0 8px 28px #0008;z-index:8}.nav{position:fixed;bottom:0;left:0;right:0;background:#08090bf5;border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));display:flex;justify-content:center;z-index:7}.navin{max-width:620px;width:100%;display:grid;grid-template-columns:repeat(3,1fr)}.nav button{border:0;background:none;color:#8e94a0;padding:8px;font-size:14px}.nav button.active{color:#a9c7ff}.screen{display:none}.screen.active{display:block}.simple{margin-top:24px;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:19px}.row{display:flex;justify-content:space-between;gap:12px;padding:15px 0;border-bottom:1px solid var(--line);font-size:17px}.empty{padding:20px;color:var(--muted);text-align:center;font-size:16px}.modal{position:fixed;inset:0;background:#000a;z-index:20;display:none;align-items:flex-end}.modal.open{display:flex}.sheet{width:100%;max-width:620px;margin:auto;background:#12151d;border-radius:28px 28px 0 0;padding:20px 20px calc(26px + env(safe-area-inset-bottom));border:1px solid #252a35}.sheetTop{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}.sheetTop h2{margin:0;font-size:25px}.close,.saveBtn{border:1px solid #363d4b;background:#1a1e27;color:white;border-radius:50%;width:44px;height:44px;font-size:23px}.saveBtn{color:#9fc3ff}.field{width:100%;background:#1c2029;border:1px solid #2c3240;color:white;border-radius:16px;padding:15px;font-size:18px;margin-bottom:14px}.label{font-size:15px;color:#aeb4bf;margin:4px 2px 8px}.types{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:15px}.type{border:1px solid #343a47;background:#191d25;color:#c8cdd5;border-radius:14px;padding:13px 5px;font-size:15px}.type.active{border-color:#79a8ff;color:#a9c7ff;background:#172238}</style></head><body><div class="app"><div id="today" class="screen active"><div class="top"><div><h1>Planner</h1><div id="dateLabel" class="date"></div></div><div id="score" class="score"></div></div><div id="week" class="week"></div><div class="chips"><button class="chip active">All</button><button class="chip">Morning</button><button class="chip">Evening</button><button class="chip">Home</button></div><div id="taskArea"></div></div><div id="progress" class="screen"><h1>Progress</h1><div class="simple"><div class="date">Today</div><h2 id="progressStat">0%</h2><div id="progressDetail" class="date"></div></div></div><div id="recurring" class="screen"><h1>Recurring</h1><div id="recList" class="simple"></div></div></div><button class="fab" onclick="openAdd()" aria-label="Add habit">+</button><nav class="nav"><div class="navin"><button class="active" data-screen="today">●<br>Today</button><button data-screen="progress">○<br>Progress</button><button data-screen="recurring">↻<br>Recurring</button></div></nav><div id="addModal" class="modal" onclick="if(event.target===this)closeAdd()"><div class="sheet"><div class="sheetTop"><button class="close" onclick="closeAdd()">×</button><h2>Add Habit</h2><button class="saveBtn" onclick="addHabit()">›</button></div><input id="habitName" class="field" placeholder="Name your habit"><div class="label">How do you want to track this?</div><div class="types"><button class="type active" data-type="check">✓ Habit</button><button class="type" data-type="count">＋ Number</button><button class="type" data-type="timer">◷ Timer</button></div><div id="goalWrap" style="display:none"><div class="label">Goal</div><input id="habitGoal" class="field" type="number" min="1" value="1"></div><div class="label">When?</div><select id="habitWhen" class="field"><option>Due Now</option><option>Later Today</option></select></div></div><script>const defaults=[['skin','🧴','Morning skin care','Daily','check','Due Now'],['vitc','🍊','Vitamin C','Daily','check','Due Now'],['brush','🪥','Brush & Floss','2 times today','count','Due Now',2],['ears','👂','Clean ears','Daily','check','Due Now'],['plants','🪴','Water plants','Daily','check','Later Today'],['journal','📓','Journal','Once a day','check','Later Today'],['reading','📖','Reading','Timer','timer','Later Today'],['bd','🪟','Close blinds downstairs','Daily','check','Later Today'],['bu','🏠','Close blinds upstairs','Daily','check','Later Today'],['pm','🌙','Night skin care','Daily','check','Later Today'],['mag','💊','Magnesium','Every night','check','Later Today'],['water','🥤','Water cups at night','Daily','check','Later Today'],['exercise','🏋️','Exercise','5 times this week','count','Later Today',5],['stretch','🧘','Stretch','5 times this week','count','Later Today',5]];let custom=JSON.parse(localStorage.getItem('planner-custom-habits')||'[]');let tasks=[...defaults,...custom];const key='planner-v2-'+new Date().toLocaleDateString('en-CA');let s=JSON.parse(localStorage.getItem(key)||'{}');if(!s.timer)s.timer={elapsed:0,running:false,startedAt:null};const save=()=>localStorage.setItem(key,JSON.stringify(s));const val=id=>s[id]||0;const done=t=>t[4]==='check'?!!s[t[0]]:t[4]==='count'?val(t[0])>=t[6]:false;function toggle(id){s[id]=!s[id];save();render()}function count(id,d,g){s[id]=Math.max(0,Math.min(g,val(id)+d));save();render()}function elapsed(){return(s.timer.elapsed||0)+(s.timer.running?Date.now()-s.timer.startedAt:0)}function fmt(ms){let x=Math.floor(ms/1000),m=Math.floor(x/60);return String(m).padStart(2,'0')+':'+String(x%60).padStart(2,'0')}function start(){if(!s.timer.running){s.timer.running=true;s.timer.startedAt=Date.now();save();render()}}function pause(){if(s.timer.running){s.timer.elapsed=elapsed();s.timer.running=false;s.timer.startedAt=null}else{s.timer.running=true;s.timer.startedAt=Date.now()}save();render()}function end(){s.timer.elapsed=elapsed();s.timer.running=false;s.timer.startedAt=null;save();render()}function item(t,d){let c=t[4]==='check'?'<button class="check '+(d?'done':'')+'" onclick="toggle(\''+t[0]+'\')"></button>':t[4]==='count'?'<div class="count"><button onclick="count(\''+t[0]+'\',-1,'+t[6]+')">−</button><b>'+val(t[0])+'/'+t[6]+'</b><button onclick="count(\''+t[0]+'\',1,'+t[6]+')">+</button></div>':'';let x=t[4]==='timer'?'<div class="timer"><span id="clock" class="clock">'+fmt(elapsed())+'</span><div class="timerBtns"><button class="primary" onclick="start()">Start</button><button onclick="pause()">'+(s.timer.running?'Pause':'Resume')+'</button><button onclick="end()">End</button></div></div>':'';return '<div class="task '+(d?'doneTask':'')+'"><div class="icon">'+t[1]+'</div><div class="info"><div class="name">'+t[2]+'</div><div class="sub">'+t[3]+'</div>'+x+'</div>'+c+'</div>'}function render(){tasks=[...defaults,...custom];let D=tasks.filter(done),O=tasks.filter(t=>!done(t)),h='';['Due Now','Later Today'].forEach(g=>{let a=O.filter(t=>t[5]===g);if(a.length)h+='<section class="section"><div class="head"><h2>'+g+'</h2><span class="sub">'+a.length+'</span></div><div class="card">'+a.map(t=>item(t,false)).join('')+'</div></section>'});h+='<section class="section"><div class="head"><h2>Done</h2><span class="sub">'+D.length+'</span></div><div class="card">'+(D.length?D.map(t=>item(t,true)).join(''):'<div class="empty">Completed items move here. Tap again to undo.</div>')+'</div></section>';taskArea.innerHTML=h;let p=Math.round(D.length/tasks.length*100);score.textContent=D.length+'/'+tasks.length+' done';progressStat.textContent=p+'%';progressDetail.textContent=D.length+' of '+tasks.length+' complete';dateLabel.textContent=new Date().toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'});let w='';for(let i=-3;i<=3;i++){let d=new Date();d.setDate(d.getDate()+i);w+='<div class="day"><div>'+d.toLocaleDateString(undefined,{weekday:'short'}).slice(0,2)+'</div><div class="ring" style="--p:'+(i===0?p:0)+'"><span>'+d.getDate()+'</span></div></div>'}week.innerHTML=w;recList.innerHTML=tasks.map(t=>'<div class="row"><span>'+t[1]+' '+t[2]+'</span><span class="date">'+t[3]+'</span></div>').join('')}let addType='check';function openAdd(){addModal.classList.add('open');setTimeout(()=>habitName.focus(),100)}function closeAdd(){addModal.classList.remove('open');habitName.value=''}document.querySelectorAll('.type').forEach(b=>b.onclick=()=>{document.querySelectorAll('.type').forEach(x=>x.classList.remove('active'));b.classList.add('active');addType=b.dataset.type;goalWrap.style.display=addType==='count'?'block':'none'});function addHabit(){let n=habitName.value.trim();if(!n)return;let id='custom_'+Date.now(),goal=Math.max(1,parseInt(habitGoal.value)||1),sub=addType==='timer'?'Timer':addType==='count'?goal+' times':'Daily';let t=[id,addType==='timer'?'⏱️':addType==='count'?'🎯':'✓',n,sub,addType,habitWhen.value];if(addType==='count')t.push(goal);custom.push(t);localStorage.setItem('planner-custom-habits',JSON.stringify(custom));closeAdd();render()}document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));document.getElementById(b.dataset.screen).classList.add('active');render()});render();setInterval(()=>{if(s.timer.running&&document.getElementById('clock'))clock.textContent=fmt(elapsed())},500);</script></body></html>
