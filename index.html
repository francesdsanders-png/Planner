<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07080a"><title>Planner</title><style>:root{--bg:#07080a;--panel:#111317;--text:#f5f7fb;--muted:#969ba6;--line:#24272e;--blue:#79a8ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Roboto,Arial,sans-serif;-webkit-tap-highlight-color:transparent}.app{max-width:620px;margin:auto;min-height:100vh;padding:22px 16px 104px}.top{display:flex;justify-content:space-between}.top h1{font-size:31px;letter-spacing:-1.1px;margin:0 0 3px}.date,.score,.sub{color:var(--muted);font-size:13px}.week{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin:22px 0 17px}.day{text-align:center;color:var(--muted);font-size:11px}.ring{--p:0;position:relative;width:42px;height:42px;border-radius:50%;margin:6px auto;background:conic-gradient(var(--blue) calc(var(--p)*1%),#262930 0);display:grid;place-items:center}.ring:after{content:"";position:absolute;inset:4px;background:var(--bg);border-radius:50%}.ring span{z-index:1;color:var(--text);font-size:13px}.chips{display:flex;gap:8px;overflow:auto}.chip{border:1px solid var(--line);background:#111318;color:#b8bdc7;border-radius:20px;padding:8px 13px}.chip.active{background:#dce8ff;color:#111827}.section{margin-top:18px}.head{display:flex;justify-content:space-between;margin:0 2px 9px}.head h2{font-size:14px;margin:0}.card{background:var(--panel);border:1px solid #1b1e24;border-radius:18px;overflow:hidden}.task{display:flex;align-items:center;gap:12px;padding:14px;border-bottom:1px solid var(--line)}.task:last-child{border:0}.icon{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-size:21px;background:#202738;flex:none}.info{flex:1}.name{font-size:15px;font-weight:600}.check{width:30px;height:30px;border:2px solid #555b67;border-radius:50%;background:transparent;color:#101318}.check.done{background:var(--blue);border-color:var(--blue)}.check.done:after{content:"✓"}.count,.timerBtns{display:flex;align-items:center;gap:7px}.count button,.timerBtns button{border:1px solid #343943;background:#1b1e24;color:var(--text);border-radius:11px;min-width:34px;height:32px}.count b{min-width:28px;text-align:center;font-size:13px}.timer{margin-top:9px}.clock{font-variant-numeric:tabular-nums;font-weight:700}.timerBtns{margin-top:8px}.timerBtns .primary{background:#dce8ff;color:#101318}.doneTask{opacity:.62}.doneTask .name{text-decoration:line-through}.nav{position:fixed;bottom:0;left:0;right:0;background:#08090bf5;border-top:1px solid var(--line);padding:9px 16px calc(9px + env(safe-area-inset-bottom));display:flex;justify-content:center}.navin{max-width:620px;width:100%;display:grid;grid-template-columns:repeat(3,1fr)}.nav button{border:0;background:none;color:#7f8490;padding:8px;font-size:11px}.nav button.active{color:#a9c7ff}.screen{display:none}.screen.active{display:block}.simple{margin-top:22px;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px}.row{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line);font-size:14px}.empty{padding:18px;color:var(--muted);text-align:center}</style></head><body><div class="app"><div id="today" class="screen active"><div class="top"><div><h1>Planner</h1><div id="dateLabel" class="date"></div></div><div id="score" class="score"></div></div><div id="week" class="week"></div><div class="chips"><button class="chip active">All</button><button class="chip">Morning</button><button class="chip">Evening</button><button class="chip">Home</button></div><div id="taskArea"></div></div><div id="progress" class="screen"><h1>Progress</h1><div class="simple"><div class="date">Today</div><h2 id="progressStat">0%</h2><div id="progressDetail" class="date"></div></div></div><div id="recurring" class="screen"><h1>Recurring</h1><div id="recList" class="simple"></div></div></div><nav class="nav"><div class="navin"><button class="active" data-screen="today">●<br>Today</button><button data-screen="progress">○<br>Progress</button><button data-screen="recurring">↻<br>Recurring</button></div></nav><script>const tasks=[['skin','🧴','Morning skin care','Daily','check','Due Now'],['vitc','🍊','Vitamin C','Daily','check','Due Now'],['brush','🪥','Brush & Floss','2 times today','count','Due Now',2],['ears','👂','Clean ears','Daily','check','Due Now'],['plants','🪴','Water plants','Daily','check','Later Today'],['journal','📓','Journal','Once a day','check','Later Today'],['reading','📖','Reading','Timer','timer','Later Today'],['bd','🪟','Close blinds downstairs','Daily','check','Later Today'],['bu','🏠','Close blinds upstairs','Daily','check','Later Today'],['pm','🌙','Night skin care','Daily','check','Later Today'],['mag','💊','Magnesium','Every night','check','Later Today'],['water','🥤','Water cups at night','Daily','check','Later Today'],['exercise','🏋️','Exercise','5 times this week','count','Later Today',5],['stretch','🧘','Stretch','5 times this week','count','Later Today',5]];const key='planner-v2-'+new Date().toLocaleDateString('en-CA');let s=JSON.parse(localStorage.getItem(key)||'{}');if(!s.timer)s.timer={elapsed:0,running:false,startedAt:null};const save=()=>localStorage.setItem(key,JSON.stringify(s));const val=id=>s[id]||0;const done=t=>t[4]==='check'?!!s[t[0]]:t[4]==='count'?val(t[0])>=t[6]:false;function toggle(id){s[id]=!s[id];save();render()}function count(id,d,g){s[id]=Math.max(0,Math.min(g,val(id)+d));save();render()}function elapsed(){return(s.timer.elapsed||0)+(s.timer.running?Date.now()-s.timer.startedAt:0)}function fmt(ms){let x=Math.floor(ms/1000),m=Math.floor(x/60);return String(m).padStart(2,'0')+':'+String(x%60).padStart(2,'0')}function start(){if(!s.timer.running){s.timer.running=true;s.timer.startedAt=Date.now();save();render()}}function pause(){if(s.timer.running){s.timer.elapsed=elapsed();s.timer.running=false;s.timer.startedAt=null}else{s.timer.running=true;s.timer.startedAt=Date.now()}save();render()}function end(){s.timer.elapsed=elapsed();s.timer.running=false;s.timer.startedAt=null;save();render()}function item(t,d){let c=t[4]==='check'?'<button class="check '+(d?'done':'')+'" onclick="toggle(\''+t[0]+'\')"></button>':t[4]==='count'?'<div class="count"><button onclick="count(\''+t[0]+'\',-1,'+t[6]+')">−</button><b>'+val(t[0])+'/'+t[6]+'</b><button onclick="count(\''+t[0]+'\',1,'+t[6]+')">+</button></div>':'';let x=t[4]==='timer'?'<div class="timer"><span id="clock" class="clock">'+fmt(elapsed())+'</span><div class="timerBtns"><button class="primary" onclick="start()">Start</button><button onclick="pause()">'+(s.timer.running?'Pause':'Resume')+'</button><button onclick="end()">End</button></div></div>':'';return '<div class="task '+(d?'doneTask':'')+'"><div class="icon">'+t[1]+'</div><div class="info"><div class="name">'+t[2]+'</div><div class="sub">'+t[3]+'</div>'+x+'</div>'+c+'</div>'}function render(){let D=tasks.filter(done),O=tasks.filter(t=>!done(t)),h='';['Due Now','Later Today'].forEach(g=>{let a=O.filter(t=>t[5]===g);if(a.length)h+='<section class="section"><div class="head"><h2>'+g+'</h2><span class="sub">'+a.length+'</span></div><div class="card">'+a.map(t=>item(t,false)).join('')+'</div></section>'});h+='<section class="section"><div class="head"><h2>Done</h2><span class="sub">'+D.length+'</span></div><div class="card">'+(D.length?D.map(t=>item(t,true)).join(''):'<div class="empty">Completed items move here. Tap again to undo.</div>')+'</div></section>';taskArea.innerHTML=h;let p=Math.round(D.length/tasks.length*100);score.textContent=D.length+'/'+tasks.length+' done';progressStat.textContent=p+'%';progressDetail.textContent=D.length+' of '+tasks.length+' complete';dateLabel.textContent=new Date().toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'});let w='';for(let i=-3;i<=3;i++){let d=new Date();d.setDate(d.getDate()+i);w+='<div class="day"><div>'+d.toLocaleDateString(undefined,{weekday:'short'}).slice(0,2)+'</div><div class="ring" style="--p:'+(i===0?p:0)+'"><span>'+d.getDate()+'</span></div></div>'}week.innerHTML=w;recList.innerHTML=tasks.map(t=>'<div class="row"><span>'+t[1]+' '+t[2]+'</span><span class="date">'+t[3]+'</span></div>').join('')}document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));document.getElementById(b.dataset.screen).classList.add('active');render()});render();setInterval(()=>{if(s.timer.running&&document.getElementById('clock'))clock.textContent=fmt(elapsed())},500);</script></body></html>
