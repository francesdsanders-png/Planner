<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07080a"><title>Planner</title><style>:root{--bg:#07080a;--panel:#111317;--text:#f5f7fb;--muted:#a6acb7;--line:#252932;--blue:#3b82f6}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Roboto,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;font-size:18px}.app{max-width:620px;margin:auto;min-height:100vh;padding:28px 20px 130px}h1{font-size:40px;margin:0 0 6px}.muted,.sub{color:var(--muted)}.screen{display:none}.screen.active{display:block}.top{display:flex;justify-content:space-between}.week{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin:24px 0}.day{text-align:center;color:var(--muted);font-size:14px}.ring{width:48px;height:48px;border-radius:50%;margin:7px auto;background:#171a20;display:grid;place-items:center;border:1px solid #2b3039}.chips{display:flex;gap:9px;overflow:auto}.chip{border:1px solid #343945;background:#11141a;color:#b7bdc7;border-radius:24px;padding:12px 17px;font-size:17px}.chip.active{background:#293040;color:white}.section{margin-top:25px}.head{display:flex;justify-content:space-between;margin:0 3px 11px}.head h2{font-size:21px;margin:0}.card{background:var(--panel);border:1px solid #232730;border-radius:22px;overflow:hidden}.task{display:flex;align-items:center;gap:15px;padding:18px 16px;border-bottom:1px solid var(--line);min-height:82px}.task:last-child{border:0}.icon{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-size:24px;background:#202738;flex:none}.info{flex:1}.name{font-size:20px;font-weight:650}.sub{font-size:16px;margin-top:3px}.check{width:40px;height:40px;border:2px solid #69717f;border-radius:50%;background:none;color:white}.count{display:flex;gap:9px;align-items:center}.count button{border:1px solid #3a404b;background:#1b1e24;color:white;border-radius:13px;width:42px;height:42px;font-size:21px}.weeklyCircle{--p:0;width:54px;height:54px;border-radius:50%;background:conic-gradient(var(--blue) calc(var(--p)*1%),#2a303a 0);padding:5px;display:grid;place-items:center;flex:none}.weeklyCircle span{width:100%;height:100%;border-radius:50%;background:#11151c;display:grid;place-items:center;font-size:14px;font-weight:700}.progressCard,.simple{margin-top:22px;background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:18px}.progressRow,.row{padding:15px 0;border-bottom:1px solid var(--line)}.progressTop,.row{display:flex;justify-content:space-between;gap:15px}.miniBar{height:8px;background:#292e38;border-radius:8px;margin-top:9px;overflow:hidden}.miniBar i{display:block;height:100%;background:var(--blue)}.fab{position:fixed;right:24px;bottom:calc(98px + env(safe-area-inset-bottom));width:66px;height:66px;border:0;border-radius:50%;background:var(--blue);color:white;font-size:40px;z-index:50}.nav{position:fixed;bottom:0;left:0;right:0;background:#08090bf5;border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));z-index:40}.navin{max-width:620px;margin:auto;display:grid;grid-template-columns:repeat(3,1fr)}.nav button{border:0;background:none;color:#969ca7;padding:8px;font-size:16px}.nav button.active{color:#8db7ff}.modal{position:fixed;inset:0;background:#000c;z-index:100;display:none;align-items:flex-end}.modal.open{display:flex}.sheet{width:100%;max-width:620px;margin:auto;background:#131720;border-radius:30px 30px 0 0;padding:22px 22px calc(30px + env(safe-area-inset-bottom))}.sheetTop{display:flex;justify-content:space-between;align-items:center}.close,.saveBtn{width:50px;height:50px;border-radius:50%;border:1px solid #3a414e;background:#1b202a;color:white;font-size:25px}.field{width:100%;background:#1c2029;border:1px solid #303746;color:white;border-radius:17px;padding:17px;font-size:20px;margin:16px 0}.types{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.type{border:1px solid #3a414e;background:#191d25;color:#d0d5dd;border-radius:15px;padding:16px 6px}.type.active{border-color:#79a8ff}.timerSheet{text-align:center}.timerTime{font-size:72px;margin:32px 0}.timerAdjust,.timerActions{display:flex;justify-content:center;gap:12px}.timerAdjust button,.timerActions button{border:1px solid #3a414e;border-radius:16px;background:#1d222b;color:white;font-size:19px;padding:14px 20px}.timerActions{margin-top:24px}.primary{background:var(--blue)!important}</style></head><body><div class="app"><div id="today" class="screen active"><div class="top"><div><h1>Planner</h1><div id="dateLabel" class="muted"></div></div><div id="score" class="muted"></div></div><div id="week" class="week"></div><div class="chips"><button class="chip active">All</button><button class="chip">Morning</button><button class="chip">Evening</button><button class="chip">Home</button></div><div id="taskArea"></div></div><div id="progress" class="screen"><h1>Reports</h1><div class="muted">Your progress</div><div id="progressRows" class="progressCard"></div></div><div id="recurring" class="screen"><h1>Recurring</h1><div id="recList" class="simple"></div></div></div><button class="fab" id="fab">+</button><nav class="nav"><div class="navin"><button class="active" data-screen="today">●<br>Today</button><button data-screen="progress">▥<br>Reports</button><button data-screen="recurring">↻<br>Recurring</button></div></nav><div id="addModal" class="modal"><div class="sheet"><div class="sheetTop"><button class="close" id="closeAdd">×</button><h2>Add Habit</h2><button class="saveBtn" id="saveHabit">✓</button></div><input id="habitName" class="field" placeholder="Name your habit"><div class="types"><button class="type active" data-type="check">✓ Habit</button><button class="type" data-type="count">＋ Number</button><button class="type" data-type="timer">◷ Timer</button></div><div id="goalWrap" style="display:none"><input id="habitGoal" class="field" type="number" min="1" value="1"></div><select id="habitWhen" class="field"><option>Due Now</option><option>Later Today</option></select></div></div><div id="timerModal" class="modal"><div class="sheet timerSheet"><div class="sheetTop"><button class="close" id="closeTimer">×</button><h2>Reading</h2><span style="width:50px"></span></div><div id="timerBig" class="timerTime">20:00</div><div class="timerAdjust"><button id="minusTimer">− 5 min</button><button id="plusTimer">+ 5 min</button></div><div class="timerActions"><button id="resetTimer">Reset</button><button id="timerStart" class="primary">Start</button><button id="finishTimer">End</button></div></div></div><script>const defaults=[['skin','🧴','Morning skin care','Daily','check','Due Now'],['vitc','🍊','Vitamin C','Daily','check','Due Now'],['brush','🪥','Brush & Floss','2 times today','count','Due Now',2],['ears','👂','Clean ears','Daily','check','Due Now'],['plants','🪴','Water plants','Daily','check','Later Today'],['journal','📓','Journal','Once a day','check','Later Today'],['reading','📖','Reading','20 minute timer','timer','Later Today'],['bd','🪟','Close blinds downstairs','Daily','check','Later Today'],['bu','🏠','Close blinds upstairs','Daily','check','Later Today'],['pm','🌙','Night skin care','Daily','check','Later Today'],['mag','💊','Magnesium','Every night','check','Later Today'],['water','🥤','Water cups at night','Daily','check','Later Today'],['exercise','🏋️','Exercise','5 times this week','count','Later Today',5,'weekly'],['stretch','🧘','Stretch','5 times this week','count','Later Today',5,'weekly']];let custom=JSON.parse(localStorage.getItem('planner-custom-habits')||'[]');const dateKey=()=>new Date().toLocaleDateString('en-CA'),dailyKey='planner-v3-'+dateKey();let s=JSON.parse(localStorage.getItem(dailyKey)||'{}');if(!s.timer)s.timer={duration:1200000,remaining:1200000,running:false,startedAt:null,completed:false};function mondayKey(){let d=new Date(),day=(d.getDay()+6)%7;d.setHours(0,0,0,0);d.setDate(d.getDate()-day);return 'planner-week-'+d.toLocaleDateString('en-CA')}const wk=mondayKey();let w=JSON.parse(localStorage.getItem(wk)||'{}');if(!w._migrated){let legacy=JSON.parse(localStorage.getItem('planner-v2-'+dateKey())||'{}');let yesterday=new Date();yesterday.setDate(yesterday.getDate()-1);let oldYesterday=JSON.parse(localStorage.getItem('planner-v2-'+yesterday.toLocaleDateString('en-CA'))||'{}');w.exercise=Math.max(Number(w.exercise||0),Number(legacy.exercise||0),Number(oldYesterday.exercise||0));w.stretch=Math.max(Number(w.stretch||0),Number(legacy.stretch||0),Number(oldYesterday.stretch||0));w._migrated=true;localStorage.setItem(wk,JSON.stringify(w))}const save=()=>localStorage.setItem(dailyKey,JSON.stringify(s)),saveWeek=()=>localStorage.setItem(wk,JSON.stringify(w)),tasks=()=>[...defaults,...custom],weekly=t=>t[7]==='weekly',value=t=>weekly(t)?Number(w[t[0]]||0):Number(s[t[0]]||0),doneToday=t=>weekly(t)?!!s['weeklyDone_'+t[0]]:t[4]==='check'?!!s[t[0]]:t[4]==='count'?value(t)>=t[6]:t[4]==='timer'?!!s.timer.completed:false;function toggle(id){s[id]=!s[id];save();render()}function countTask(t,d){if(weekly(t)){if(d>0&&!s['weeklyDone_'+t[0]]){w[t[0]]=Math.min(t[6],Number(w[t[0]]||0)+1);s['weeklyDone_'+t[0]]=true}else if(d<0&&s['weeklyDone_'+t[0]]){w[t[0]]=Math.max(0,Number(w[t[0]]||0)-1);s['weeklyDone_'+t[0]]=false}saveWeek();save()}else{s[t[0]]=Math.max(0,Math.min(t[6],value(t)+d));save()}render()}function remaining(){return s.timer.running?Math.max(0,s.timer.remaining-(Date.now()-s.timer.startedAt)):Math.max(0,s.timer.remaining)}function fmt(ms){let x=Math.max(0,Math.ceil(ms/1000));return String(Math.floor(x/60)).padStart(2,'0')+':'+String(x%60).padStart(2,'0')}function item(t){let c='';if(t[4]==='check')c='<button class="check" data-toggle="'+t[0]+'"></button>';if(t[4]==='count'&&!weekly(t))c='<div class="count"><button data-id="'+t[0]+'" data-d="-1">−</button><b>'+value(t)+'/'+t[6]+'</b><button data-id="'+t[0]+'" data-d="1">+</button></div>';if(weekly(t)){let p=Math.round(value(t)/t[6]*100);c='<div class="weeklyCircle" style="--p:'+p+'"><span>'+value(t)+'/'+t[6]+'</span></div>'}return '<div class="task" data-timer="'+(t[4]==='timer'?'1':'0')+'"><div class="icon">'+t[1]+'</div><div class="info"><div class="name">'+t[2]+'</div><div class="sub">'+(weekly(t)?'This week · tap circle to log today':t[4]==='timer'?'Tap to open timer · '+fmt(remaining()):t[3])+'</div></div>'+c+'</div>'}function render(){let T=tasks(),O=T.filter(t=>!doneToday(t)),D=T.filter(doneToday),h='';['Due Now','Later Today'].forEach(g=>{let a=O.filter(t=>t[5]===g);if(a.length)h+='<section class="section"><div class="head"><h2>'+g+'</h2><span class="sub">'+a.length+'</span></div><div class="card">'+a.map(item).join('')+'</div></section>'});taskArea.innerHTML=h;score.textContent=D.length+'/'+T.length+' done';dateLabel.textContent=new Date().toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'});let days='';for(let i=-3;i<=3;i++){let d=new Date();d.setDate(d.getDate()+i);days+='<div class="day">'+d.toLocaleDateString(undefined,{weekday:'short'}).slice(0,2)+'<div class="ring">'+d.getDate()+'</div></div>'}week.innerHTML=days;recList.innerHTML=T.map(t=>'<div class="row"><span>'+t[1]+' '+t[2]+'</span><span class="muted">'+(weekly(t)?value(t)+'/'+t[6]+' this week':t[3])+'</span></div>').join('');progressRows.innerHTML=T.map(t=>{let p=weekly(t)?Math.round(value(t)/t[6]*100):(doneToday(t)?100:0);return '<div class="progressRow"><div class="progressTop"><span>'+t[1]+' '+t[2]+'</span><b>'+(weekly(t)?value(t)+'/'+t[6]:doneToday(t)?'Done':'Not yet')+'</b></div><div class="miniBar"><i style="width:'+p+'%"></i></div></div>'}).join('');bind()}function bind(){document.querySelectorAll('[data-toggle]').forEach(b=>b.onclick=e=>{e.stopPropagation();toggle(b.dataset.toggle)});document.querySelectorAll('[data-id]').forEach(b=>b.onclick=e=>{e.stopPropagation();let t=tasks().find(x=>x[0]===b.dataset.id);countTask(t,Number(b.dataset.d))});document.querySelectorAll('.weeklyCircle').forEach((b,i)=>{b.onclick=e=>{e.stopPropagation();let t=tasks().filter(weekly).find(x=>x[2]===b.closest('.task').querySelector('.name').textContent);countTask(t,1)}});document.querySelectorAll('[data-timer="1"]').forEach(x=>x.onclick=()=>{timerModal.classList.add('open');paintTimer()})}function paintTimer(){timerBig.textContent=fmt(remaining());timerStart.textContent=s.timer.running?'Pause':'Start'}let addType='check';fab.onclick=()=>addModal.classList.add('open');closeAdd.onclick=()=>addModal.classList.remove('open');document.querySelectorAll('.type').forEach(b=>b.onclick=()=>{document.querySelectorAll('.type').forEach(x=>x.classList.remove('active'));b.classList.add('active');addType=b.dataset.type;goalWrap.style.display=addType==='count'?'block':'none'});saveHabit.onclick=()=>{let n=habitName.value.trim();if(!n)return;let goal=Math.max(1,parseInt(habitGoal.value)||1),t=['custom_'+Date.now(),addType==='timer'?'⏱️':addType==='count'?'🎯':'✓',n,addType==='timer'?'Timer':addType==='count'?goal+' times':'Daily',addType,habitWhen.value];if(addType==='count')t.push(goal);custom.push(t);localStorage.setItem('planner-custom-habits',JSON.stringify(custom));habitName.value='';addModal.classList.remove('open');render()};document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));document.getElementById(b.dataset.screen).classList.add('active')});closeTimer.onclick=()=>timerModal.classList.remove('open');minusTimer.onclick=()=>{if(!s.timer.running){s.timer.remaining=Math.max(300000,s.timer.remaining-300000);s.timer.duration=s.timer.remaining;save();paintTimer()}};plusTimer.onclick=()=>{if(!s.timer.running){s.timer.remaining=Math.min(7200000,s.timer.remaining+300000);s.timer.duration=s.timer.remaining;save();paintTimer()}};timerStart.onclick=()=>{if(s.timer.running){s.timer.remaining=remaining();s.timer.running=false}else{s.timer.running=true;s.timer.startedAt=Date.now()}save();paintTimer()};resetTimer.onclick=()=>{s.timer.remaining=s.timer.duration;s.timer.running=false;s.timer.completed=false;save();paintTimer()};finishTimer.onclick=()=>{s.timer.running=false;s.timer.remaining=0;s.timer.completed=true;save();timerModal.classList.remove('open');render()};render();setInterval(()=>{if(s.timer.running){if(remaining()<=0){s.timer.running=false;s.timer.completed=true;s.timer.remaining=0;save();timerModal.classList.remove('open');render()}else paintTimer()}},500);</script></body></html>
